<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ngọc Becon - Free Fire 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* ====== GAME CONTAINER ====== */
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ====== HUD ====== */
        #hud {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 5px 15px;
            border-radius: 25px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            pointer-events: none;
            white-space: nowrap;
        }

        .hud-item {
            text-align: center;
            min-width: 40px;
        }

        .hud-label {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .hud-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ff69b4;
        }

        /* ====== JOYSTICK ====== */
        #joystickArea {
            position: fixed;
            bottom: 100px;
            left: 20px;
            width: 110px;
            height: 110px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 3px solid rgba(255, 105, 180, 0.5);
            backdrop-filter: blur(10px);
            touch-action: none;
        }

        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.5);
            pointer-events: none;
        }

        /* ====== ACTION BUTTONS ====== */
        #actionButtons {
            position: fixed;
            bottom: 100px;
            right: 10px;
            z-index: 100;
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 120px;
        }

        .action-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 105, 180, 0.3);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

        .action-btn:active {
            transform: scale(0.9);
            background: rgba(255, 20, 147, 0.6);
        }

        .action-btn.jump {
            width: 55px;
            height: 55px;
            background: rgba(255, 215, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .action-btn.small {
            width: 35px;
            height: 35px;
            font-size: 0.8rem;
        }

        /* ====== WEAPON BAR ====== */
        #weaponBar {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 4px;
            border-radius: 15px;
            border: 2px solid rgba(255, 105, 180, 0.3);
        }

        .weapon-slot {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.1);
        }

        .weapon-slot.active {
            border-color: #ff69b4;
            background: rgba(255, 105, 180, 0.3);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
        }

        /* ====== MENU PANEL ====== */
        #menuPanel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1000;
            background: rgba(20, 10, 40, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 20px;
            border: 2px solid rgba(255, 105, 180, 0.5);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8);
            width: 85%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        #menuPanel.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .menu-title {
            font-size: 1.5rem;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            text-align: center;
        }

        .menu-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .menu-tab {
            padding: 8px 12px;
            border-radius: 15px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 0.75rem;
            transition: all 0.3s;
        }

        .menu-tab.active {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            border-color: #ff69b4;
        }

        .menu-content {
            display: none;
        }

        .menu-content.active {
            display: block;
        }

        .menu-section {
            margin-bottom: 10px;
        }

        .menu-section-title {
            font-size: 0.85rem;
            color: #ff69b4;
            margin-bottom: 8px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 5px;
        }

        .menu-item {
            padding: 8px;
            border-radius: 10px;
            border: 2px solid rgba(255, 105, 180, 0.2);
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .menu-item:hover {
            border-color: #ff69b4;
            background: rgba(255, 105, 180, 0.2);
        }

        .menu-item-icon {
            font-size: 1.2rem;
            margin-bottom: 3px;
        }

        .menu-item-name {
            font-size: 0.65rem;
        }

        .menu-input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 8px;
            outline: none;
            font-size: 0.85rem;
        }

        .menu-btn {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 5px;
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.5);
        }

        .menu-btn.danger {
            background: linear-gradient(45deg, #ff4444, #cc0000);
        }

        .menu-btn.success {
            background: linear-gradient(45deg, #00ff88, #00cc66);
        }

        /* ====== MINI MAP ====== */
        #miniMap {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            width: 80px;
            height: 80px;
            border-radius: 12px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        /* ====== LOBBY ====== */
        #lobby {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0533, #2d1b69, #4a1942);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 50% 0%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 100%; }
        }

        .lobby-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: cardEntrance 1s ease-out forwards;
            opacity: 0;
        }

        @keyframes cardEntrance {
            0% { 
                opacity: 0;
                transform: translateZ(-400px) rotateX(45deg) scale(0.5);
                filter: blur(10px);
            }
            100% { 
                opacity: 1;
                transform: translateZ(0) rotateX(0deg) scale(1);
                filter: blur(0);
            }
        }

        .lobby-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            background-size: 300% 300%;
            animation: gradientMove 3s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 15px;
            box-shadow: 0 0 60px rgba(255, 20, 147, 0.6);
            position: relative;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .lobby-logo::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid rgba(255, 105, 180, 0.4);
            animation: ringExpand 3s ease-out infinite;
        }

        @keyframes ringExpand {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .lobby-title {
            font-size: 2rem;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .lobby-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
        }

        .player-id {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .player-id-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .player-id-value {
            font-size: 1.2rem;
            color: #ff69b4;
            font-weight: 700;
        }

        .lobby-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(255, 20, 147, 0.5);
            margin-bottom: 8px;
        }

        .lobby-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 60px rgba(255, 20, 147, 0.8);
        }

        .lobby-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 105, 180, 0.3);
            box-shadow: none;
        }

        /* ====== ROTATE SCREEN ====== */
        #rotateScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: linear-gradient(135deg, #1a0533, #2d1b69);
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        #rotateScreen .rotate-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        @keyframes rotatePhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        #rotateScreen .rotate-text {
            font-size: 1.2rem;
            color: #ff69b4;
            font-weight: 700;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 768px) {
            #hud { padding: 5px 10px; gap: 8px; }
            .hud-value { font-size: 0.85rem; }
            .hud-label { font-size: 0.5rem; }
            .hud-item { min-width: 35px; }
            
            #joystickArea { bottom: 90px; left: 15px; width: 100px; height: 100px; }
            #joystickKnob { width: 35px; height: 35px; }
            
            #actionButtons { bottom: 90px; right: 10px; max-width: 100px; }
            .action-btn { width: 40px; height: 40px; font-size: 0.9rem; }
            .action-btn.jump { width: 50px; height: 50px; }
            .action-btn.small { width: 32px; height: 32px; font-size: 0.7rem; }
            
            #weaponBar { bottom: 10px; padding: 4px; gap: 4px; }
            .weapon-slot { width: 35px; height: 35px; font-size: 1rem; }
            
            #miniMap { width: 70px; height: 70px; }
            
            .lobby-card { padding: 20px; }
            .lobby-title { font-size: 1.8rem; }
            .lobby-logo { width: 70px; height: 70px; font-size: 30px; }
            .lobby-logo::after { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>

    <!-- ROTATE SCREEN -->
    <div id="rotateScreen">
        <div>
            <div class="rotate-icon">📱</div>
            <div class="rotate-text">Xoay màn hình ngang để chơi!</div>
        </div>
    </div>

    <!-- GAME CONTAINER -->
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-item">
            <div class="hud-label">Điểm</div>
            <div class="hud-value" id="scoreDisplay">0</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Máu</div>
            <div class="hud-value" id="healthDisplay">100</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Kill</div>
            <div class="hud-value" id="killDisplay">0</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Boss</div>
            <div class="hud-value" id="bossDisplay">0</div>
        </div>
    </div>

    <!-- MINI MAP -->
    <canvas id="miniMap" width="80" height="80"></canvas>

    <!-- JOYSTICK -->
    <div id="joystickArea">
        <div id="joystickKnob"></div>
    </div>

    <!-- ACTION BUTTONS -->
    <div id="actionButtons">
        <button class="action-btn" id="attackBtn">🔫</button>
        <button class="action-btn jump" id="jumpBtn">⬆️</button>
        <button class="action-btn small" id="crouchBtn">🙇</button>
        <button class="action-btn small" id="healBtn">💊</button>
        <button class="action-btn small" id="grenadeBtn">💣</button>
        <button class="action-btn small" id="menuBtn">⚙️</button>
    </div>

    <!-- WEAPON BAR -->
    <div id="weaponBar">
        <div class="weapon-slot active" onclick="selectWeapon(0)">🔫</div>
        <div class="weapon-slot" onclick="selectWeapon(1)">🔪</div>
        <div class="weapon-slot" onclick="selectWeapon(2)">💣</div>
        <div class="weapon-slot" onclick="selectWeapon(3)">🧨</div>
    </div>

    <!-- MENU PANEL -->
    <div id="menuPanel">
        <div class="menu-title">⚙️ ADMIN PANEL</div>
        
        <div class="menu-tabs">
            <button class="menu-tab active" onclick="switchTab('hack')">💀 HACK</button>
            <button class="menu-tab" onclick="switchTab('weapons')">🔫 SÚNG</button>
            <button class="menu-tab" onclick="switchTab('vehicles')">🚗 XE</button>
            <button class="menu-tab" onclick="switchTab('login')">🔐 LOGIN</button>
        </div>

        <div class="menu-content active" id="tab-hack">
            <div class="menu-section">
                <div class="menu-section-title">💀 HACK TOOL</div>
                <button class="menu-btn success" onclick="toggleAimbot()">🎯 AIMBOT: OFF</button>
                <button class="menu-btn success" onclick="toggleFly()">🕊️ FLY: OFF</button>
                <button class="menu-btn success" onclick="toggleAutoKill()">⚔️ AUTO KILL: OFF</button>
                <button class="menu-btn success" onclick="toggleGodMode()">🛡️ GOD MODE: OFF</button>
                <button class="menu-btn success" onclick="toggleSpeedHack()">⚡ SPEED: OFF</button>
            </div>
        </div>

        <div class="menu-content" id="tab-weapons">
            <div class="menu-section">
                <div class="menu-section-title">🔫 CHỌN SÚNG</div>
                <div class="menu-grid">
                    <div class="menu-item" onclick="giveWeapon('pistol')">
                        <div class="menu-item-icon">🔫</div>
                        <div class="menu-item-name">Pistol</div>
                    </div>
                    <div class="menu-item" onclick="giveWeapon('rifle')">
                        <div class="menu-item-icon">🔫</div>
                        <div class="menu-item-name">Rifle</div>
                    </div>
                    <div class="menu-item" onclick="giveWeapon('shotgun')">
                        <div class="menu-item-icon">💥</div>
                        <div class="menu-item-name">Shotgun</div>
                    </div>
                    <div class="menu-item" onclick="giveWeapon('sniper')">
                        <div class="menu-item-icon">🎯</div>
                        <div class="menu-item-name">Sniper</div>
                    </div>
                    <div class="menu-item" onclick="giveWeapon('ak')">
                        <div class="menu-item-icon">🔥</div>
                        <div class="menu-item-name">AK-47</div>
                    </div>
                    <div class="menu-item" onclick="giveWeapon('smg')">
                        <div class="menu-item-icon">⚡</div>
                        <div class="menu-item-name">SMG</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="menu-content" id="tab-vehicles">
            <div class="menu-section">
                <div class="menu-section-title">🚗 XE CỘ</div>
                <button class="menu-btn" onclick="spawnVehicle('car')">🚗 XE OTO</button>
                <button class="menu-btn" onclick="spawnVehicle('moto')">🏍️ XE MOTO</button>
                <button class="menu-btn" onclick="spawnVehicle('plane')">✈️ MÁY BAY</button>
                <button class="menu-btn" onclick="spawnVehicle('heli')">🚁 TRỰC THĂNG</button>
                <button class="menu-btn danger" onclick="removeVehicle()">❌ XÓA XE</button>
            </div>
        </div>

        <div class="menu-content" id="tab-login">
            <div class="menu-section">
                <div class="menu-section-title">🔐 ĐĂNG NHẬP ADMIN</div>
                <input class="menu-input" type="text" id="adminUser" placeholder="Tên đăng nhập">
                <input class="menu-input" type="password" id="adminPass" placeholder="Mật khẩu">
                <button class="menu-btn" onclick="loginAdmin()">🔐 ĐĂNG NHẬP</button>
                <div class="player-id">
                    <div class="player-id-label">🆔 ID CỦA BẠN</div>
                    <div class="player-id-value" id="myPlayerId">-</div>
                </div>
            </div>
        </div>
    </div>

    <!-- LOBBY -->
    <div id="lobby">
        <div class="lobby-card">
            <div class="lobby-logo">🎮</div>
            <h1 class="lobby-title">Ngọc Becon 3D</h1>
            <p class="lobby-subtitle">Game Free Fire 3D Online</p>
            
            <div class="player-id">
                <div class="player-id-label">🆔 ID CỦA BẠN</div>
                <div class="player-id-value" id="lobbyPlayerId">-</div>
            </div>
            
            <button class="lobby-btn" onclick="joinGame()">🎮 VÀO GAME</button>
            <button class="lobby-btn secondary" onclick="window.location.href='index.html'">🏠 TRANG CHÍNH</button>
        </div>
    </div>

    <script>
        // ====== CHẶN PHÓNG TO ======
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        document.addEventListener('dblclick', function(e) { e.preventDefault(); });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        });

        // ====== ROTATE SCREEN ======
        function checkOrientation() {
            const rotateScreen = document.getElementById('rotateScreen');
            if (window.innerHeight > window.innerWidth) {
                rotateScreen.style.display = 'flex';
            } else {
                rotateScreen.style.display = 'none';
            }
        }

        window.addEventListener('resize', checkOrientation);
        checkOrientation();

        // ====== PLAYER ID ======
        let playerId = '';
        if (localStorage.getItem('ngocbecon_player_id')) {
            playerId = localStorage.getItem('ngocbecon_player_id');
        } else {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            for (let i = 0; i < 6; i++) {
                playerId += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            localStorage.setItem('ngocbecon_player_id', playerId);
        }

        document.getElementById('lobbyPlayerId').textContent = playerId;
        document.getElementById('myPlayerId').textContent = playerId;

        // ====== THREE.JS ======
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';

        // ====== JOYSTICK ======
        function setupJoystick() {
            const joystickArea = document.getElementById('joystickArea');
            const joystickKnob = document.getElementById('joystickKnob');
            let joystickCenter = { x: 0, y: 0 };

            joystickArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = joystickArea.getBoundingClientRect();
                joystickCenter = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                joystickData.active = true;
                updateJoystick(touch.clientX, touch.clientY);
            });

            joystickArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                updateJoystick(touch.clientX, touch.clientY);
            });

            joystickArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                joystickData.active = false;
                joystickData.x = 0;
                joystickData.y = 0;
                joystickKnob.style.transform = 'translate(-50%, -50%)';
            });

            joystickArea.addEventListener('mousedown', (e) => {
                const rect = joystickArea.getBoundingClientRect();
                joystickCenter = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                joystickData.active = true;
                updateJoystick(e.clientX, e.clientY);
            });

            document.addEventListener('mousemove', (e) => {
                if (joystickData.active) {
                    updateJoystick(e.clientX, e.clientY);
                }
            });

            document.addEventListener('mouseup', () => {
                joystickData.active = false;
                joystickData.x = 0;
                joystickData.y = 0;
                joystickKnob.style.transform = 'translate(-50%, -50%)';
            });

            function updateJoystick(clientX, clientY) {
                const dx = clientX - joystickCenter.x;
                const dy = clientY - joystickCenter.y;
                const maxDist = 50;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > maxDist) {
                    const scale = maxDist / dist;
                    joystickData.x = (dx * scale) / maxDist;
                    joystickData.y = (dy * scale) / maxDist;
                } else {
                    joystickData.x = dx / maxDist;
                    joystickData.y = dy / maxDist;
                }

                joystickKnob.style.transform = `translate(${joystickData.x * 50}px, ${joystickData.y * 50}px)`;
            }
        }

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 100, 50);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x4CAF50,
                roughness: 0.8
            });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            createBuildings();
            createTrees();
            createRocks();
            createLootBoxes();
            createPlayer();

            for (let i = 0; i < 5; i++) {

            window.addEventListener('resize', onWindowResize);
            setupJoystick();

            animate(0);
        }

        // ====== CREATE WORLD ======
        function createBuildings() {
            const buildingColors = [0x888888, 0x666666, 0x999999];
            
            for (let i = 0; i < 8; i++) {
                const building = new THREE.Group();
                
                const width = 5 + Math.random() * 5;
                const height = 3 + Math.random() * 5;
                const depth = 5 + Math.random() * 5;
                
                const wallMat = new THREE.MeshStandardMaterial({ 
                    color: buildingColors[Math.floor(Math.random() * 3)],
                    roughness: 0.8
                });
                
                const floor = new THREE.Mesh(
                    new THREE.BoxGeometry(width, 0.1, depth),
                    wallMat
                );
                floor.position.y = height / 2;
                building.add(floor);
                
                const wallPositions = [
                    [0, height/2, depth/2], [0, height/2, -depth/2],
                    [width/2, height/2, 0], [-width/2, height/2, 0]
                ];
                
                wallPositions.forEach(pos => {
                    const wall = new THREE.Mesh(
                        new THREE.BoxGeometry(pos[0] === 0 ? width : 0.1, height, pos[2] === 0 ? depth : 0.1),
                        wallMat
                    );
                    wall.position.set(pos[0], pos[1], pos[2]);
                    building.add(wall);
                });
                
                const roof = new THREE.Mesh(
                    new THREE.BoxGeometry(width, 0.1, depth),
                    wallMat
                );
                roof.position.y = height;
                building.add(roof);
                
                const angle = Math.random() * Math.PI * 2;
                const radius = 30 + Math.random() * 100;
                building.position.set(
                    Math.cos(angle) * radius,
                    0,
                    Math.sin(angle) * radius
                );
                
                scene.add(building);
                buildings.push(building);
            }
        }

            enemy.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.2, 2.6, 0.45);
            enemy.add(rightEye);
            
            // Legs
            const legMat = new THREE.MeshStandardMaterial({ color: 0x880000 });
            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
            
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.3, 0.4, 0);
            enemy.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.3, 0.4, 0);
            enemy.add(rightLeg);
            
            const angle = Math.random() * Math.PI * 2;
            const radius = 30 + Math.random() * 80;
            enemy.position.set(
                player.position.x + Math.cos(angle) * radius,
                0,
                player.position.z + Math.sin(angle) * radius
            );
            
            scene.add(enemy);
            enemies.push({
                mesh: enemy,
                health: 100,
                speed: 3 + Math.random() * 2,
                attackRange: 3,
                attackCooldown: 0
            });
        }

        // ====== SPAWN BOSS ======
        function spawnBoss() {
            if (boss) return;
            
            const bossGroup = new THREE.Group();
            
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(3, 4, 2),
                new THREE.MeshStandardMaterial({ 
                    color: 0x8B0000,
                    metalness: 0.5,
                    roughness: 0.3
                })
            );
            body.position.y = 2.5;
            bossGroup.add(body);
            
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(1, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0x660000 })
            );
            head.position.y = 5;
            bossGroup.add(head);
            
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000 });
            const eyeGeo = new THREE.SphereGeometry(0.3, 8, 8);
            
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.4, 5.2, 0.9);
            bossGroup.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.4, 5.2, 0.9);
            bossGroup.add(rightEye);
            
            const crown = new THREE.Mesh(
                new THREE.ConeGeometry(0.8, 1, 8),
                new THREE.MeshStandardMaterial({ 
                    color: 0xffd700,
                    metalness: 0.8
                })
            );
            crown.position.y = 5.8;
            bossGroup.add(crown);
            
            bossGroup.position.set(50, 0, 50);
            
            scene.add(bossGroup);
            boss = {
                mesh: bossGroup,
                health: 500,
                maxHealth: 500,
                speed: 5,
                attackRange: 5,
                attackCooldown: 0
            };
            
            document.getElementById('bossDisplay').textContent = '1';
        }

        // ====== GAME LOOP ======
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            if (!gameRunning) {
                renderer.render(scene, camera);
                return;
            }
            
            const delta = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            time += delta;
            
            updatePlayer(delta);
            updateCamera();
            updateEnemies(delta);
            updateBoss(delta);
            updateBullets(delta);
            updateGrenades(delta);
            updateParticles(delta);
            updateLootBoxes();
            updateVehicles(delta);
            updateMiniMap();
            updateUI();
            
            if (autoKill && enemies.length > 0) {
                enemies.forEach((enemy, index) => {
                    scene.remove(enemy.mesh);
                    enemies.splice(index, 1);
                    kills++;
                    score += 100;
                    spawnEnemy();
                });
            }
            
            renderer.render(scene, camera);
        }

        function updatePlayer(delta) {
            if (currentVehicle) {
                let moveX = 0;
                let moveZ = 0;
                
                if (keys['w'] || keys['arrowup']) moveZ -= 1;
                if (keys['s'] || keys['arrowdown']) moveZ += 1;
                if (keys['a'] || keys['arrowleft']) moveX -= 1;
                if (keys['d'] || keys['arrowright']) moveX += 1;
                
                if (joystickData.active) {
                    moveX = joystickData.x;
                    moveZ = joystickData.y;
                }
                
                const speed = currentVehicle.speed * delta;
                currentVehicle.mesh.position.x += moveX * speed;
                currentVehicle.mesh.position.z += moveZ * speed;
                
                if (currentVehicle.type === 'plane' || currentVehicle.type === 'heli') {
                    currentVehicle.mesh.position.y += (keys[' '] ? 1 : 0) * speed;
                }
                
                player.position.copy(currentVehicle.mesh.position);
                player.position.y += 1;
                return;
            }
            
            let moveX = 0;
            let moveZ = 0;
            
            if (keys['w'] || keys['arrowup']) moveZ -= 1;
            if (keys['s'] || keys['arrowdown']) moveZ += 1;
            if (keys['a'] || keys['arrowleft']) moveX -= 1;
            if (keys['d'] || keys['arrowright']) moveX += 1;
            
            if (joystickData.active) {
                moveX = joystickData.x;
                moveZ = joystickData.y;
            }
            
            const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (length > 0) {
                moveX = moveX / length;
                moveZ = moveZ / length;
                
                const angle = Math.atan2(moveX, moveZ);
                player.rotation.y = angle;
                
                let speed = 15;
                if (speedHack) speed = 40;
                
                player.position.x += moveX * speed * delta;
                player.position.z += moveZ * speed * delta;
            }
            
            if (fly) {
                player.position.y += (keys[' '] ? 10 : 0) * delta;
                player.position.y -= (keys['shift'] ? 10 : 0) * delta;
                player.position.y = Math.max(0, player.position.y);
            } else {
                playerVelocity.y -= 20 * delta;
                player.position.y += playerVelocity.y * delta;
                
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    playerVelocity.y = 0;
                }
            }
            
            player.position.x = Math.max(-250, Math.min(250, player.position.x));
            player.position.z = Math.max(-250, Math.min(250, player.position.z));
            
            // Animation chân khi di chuyển
            if (length > 0 && player.position.y <= 0.1) {
                player.children.forEach((child, index) => {
                    if (index >= 6) {
                        child.rotation.x = Math.sin(time * 10) * 0.5;
                    }
                });
            }
        }

        function updateCamera() {
            if (cameraMode === 'first') {
                // Camera góc nhìn thứ nhất
                const direction = new THREE.Vector3(0, 0, -1);
                direction.applyQuaternion(player.quaternion);
                camera.position.copy(player.position);
                camera.position.y += 2;
                camera.lookAt(player.position.clone().add(direction.multiplyScalar(10)));
            } else {
                // Camera góc nhìn thứ 3
                const cameraOffset = new THREE.Vector3(0, 15, 12);
                const cameraTarget = player.position.clone().add(cameraOffset);
                camera.position.lerp(cameraTarget, 0.1);
                camera.lookAt(player.position);
            }
        }

        function updateEnemies(delta) {
            enemies.forEach((enemy, index) => {
                const direction = new THREE.Vector3()
                    .subVectors(player.position, enemy.mesh.position);
                direction.y = 0;
                const dist = direction.length();
                
                if (dist > 2) {
                    direction.normalize();
                    enemy.mesh.position.add(direction.multiplyScalar(enemy.speed * delta));
                    enemy.mesh.rotation.y = Math.atan2(direction.x, direction.z);
                }
                
                if (dist < enemy.attackRange) {
                    enemy.attackCooldown -= delta;
                    if (enemy.attackCooldown <= 0) {
                        if (!godMode) {
                            health -= 10;
                        }
                        enemy.attackCooldown = 2;
                        if (health <= 0) {
                            gameOver();
                        }
                    }
                }
                
                enemy.mesh.position.y = Math.sin(time * 3 + index) * 0.1;
            });
        }

        function updateBoss(delta) {
            if (!boss) return;
            
            const direction = new THREE.Vector3()
                .subVectors(player.position, boss.mesh.position);
            direction.y = 0;
            const dist = direction.length();
            
            if (dist > 3) {
                direction.normalize();
                boss.mesh.position.add(direction.multiplyScalar(boss.speed * delta));
                boss.mesh.rotation.y = Math.atan2(direction.x, direction.z);
            }
            
            if (dist < boss.attackRange) {
                boss.attackCooldown -= delta;
                if (boss.attackCooldown <= 0) {
                    if (!godMode) {
                        health -= 25;
                    }
                    boss.attackCooldown = 1;
                    if (health <= 0) {
                        gameOver();
                    }
                }
            }
            
            boss.mesh.position.y = Math.sin(time * 2) * 0.2;
        }

        function updateBullets(delta) {
            bullets = bullets.filter(bullet => {
                bullet.life -= delta;
                bullet.mesh.position.add(bullet.velocity.clone().multiplyScalar(delta));
                
                enemies.forEach((enemy, enemyIndex) => {
                    const dist = bullet.mesh.position.distanceTo(enemy.mesh.position);
                    if (dist < 2) {
                        enemy.health -= playerWeapon.damage;
                        scene.remove(bullet.mesh);
                        bullet.life = 0;
                        
                        if (enemy.health <= 0) {
                            scene.remove(enemy.mesh);
                            enemies.splice(enemyIndex, 1);
                            kills++;
                            score += 100;
                            spawnEnemy();
                            createExplosion(enemy.mesh.position);
                            dropLoot(enemy.mesh.position);
                        }
                    }
                });
                
                if (boss) {
                    const dist = bullet.mesh.position.distanceTo(boss.mesh.position);
                    if (dist < 3) {
                        boss.health -= playerWeapon.damage;
                        scene.remove(bullet.mesh);
                        bullet.life = 0;
                        
                        if (boss.health <= 0) {
                            scene.remove(boss.mesh);
                            boss = null;
                            score += 1000;
                            document.getElementById('bossDisplay').textContent = '0';
                            createExplosion(boss.mesh.position);
                            dropLoot(boss.mesh.position);
                        }
                    }
                }
                
                return bullet.life > 0;
            });
            
            bullets.forEach(bullet => {
                if (bullet.life <= 0) {
                    scene.remove(bullet.mesh);
                }
            });
            bullets = bullets.filter(bullet => bullet.life > 0);
        }

        function updateGrenades(delta) {
            grenades = grenades.filter(grenade => {
                grenade.life -= delta;
                
                if (!grenade.exploded) {
                    grenade.mesh.position.add(grenade.velocity.clone().multiplyScalar(delta));
                    grenade.velocity.y -= 10 * delta;
                    
                    if (grenade.life <= 0) {
                        grenade.exploded = true;
                        createExplosion(grenade.mesh.position);
                        
                        enemies.forEach((enemy, index) => {
                            const dist = grenade.mesh.position.distanceTo(enemy.mesh.position);
                            if (dist < 5) {
                                enemy.health -= 80;
                                if (enemy.health <= 0) {
                                    scene.remove(enemy.mesh);
                                    enemies.splice(index, 1);
                                    kills++;
                                    score += 100;
                                    spawnEnemy();
                                    dropLoot(enemy.mesh.position);
                                }
                            }
                        });
                        
                        if (boss) {
                            const dist = grenade.mesh.position.distanceTo(boss.mesh.position);
                            if (dist < 5) {
                                boss.health -= 80;
                                if (boss.health <= 0) {
                                    scene.remove(boss.mesh);
                                    boss = null;
                                    score += 1000;
                                    document.getElementById('bossDisplay').textContent = '0';
                                    dropLoot(boss.mesh.position);
                                }
                            }
                        }
                        
                        scene.remove(grenade.mesh);
                        return false;
                    }
                }
                
                return true;
            });
        }

        function updateParticles(delta) {
            particles = particles.filter(particle => {
                particle.life -= delta;
                
                if (particle.velocity) {
                    particle.mesh.position.add(particle.velocity.clone().multiplyScalar(delta));
                    particle.velocity.y -= 10 * delta;
                }
                
                const opacity = particle.life / particle.maxLife;
                if (particle.mesh.material) {
                    particle.mesh.material.opacity = opacity;
                }
                
                if (particle.life <= 0) {
                    scene.remove(particle.mesh);
                    return false;
                }
                return true;
            });
        }

        function updateLootBoxes() {
            lootBoxes.forEach(lootBox => {
                if (lootBox.collected) return;
                
                const dist = player.position.distanceTo(lootBox.mesh.position);
                if (dist < 3) {
                    lootBox.collected = true;
                    scene.remove(lootBox.mesh);
                    
                    const loots = ['súng', 'giáp', 'bom', 'keo', 'máu'];
                    const loot = loots[Math.floor(Math.random() * loots.length)];
                    
                    switch(loot) {
                        case 'súng':
                            playerWeapon.damage += 10;
                            break;
                        case 'giáp':
                            health = Math.min(150, health + 50);
                            break;
                        case 'bom':
                            score += 50;
                            break;
                        case 'keo':
                            score += 25;
                            break;
                        case 'máu':
                            health = Math.min(100, health + 40);
                            break;
                    }
                }
            });
        }

        function updateVehicles(delta) {
            if (currentVehicle && currentVehicle.type === 'heli') {
                currentVehicle.mesh.children.forEach(child => {
                    if (child.geometry && child.geometry.type === 'BoxGeometry' && child.position.y > 1.5) {
                        child.rotation.y += delta * 10;
                    }
                });
            }
        }

        function updateMiniMap() {
            const miniMap = document.getElementById('miniMap');
            const ctx = miniMap.getContext('2d');
            
            ctx.clearRect(0, 0, 80, 80);
            ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
            ctx.fillRect(0, 0, 80, 80);
            
            const scale = 80 / 500;
            const playerX = (player.position.x + 250) * scale;
            const playerZ = (player.position.z + 250) * scale;
            
            ctx.fillStyle = '#ff69b4';
            ctx.beginPath();
            ctx.arc(playerX, playerZ, 4, 0, Math.PI * 2);
            ctx.fill();
            
            enemies.forEach(enemy => {
                const x = (enemy.mesh.position.x + 250) * scale;
                const z = (enemy.mesh.position.z + 250) * scale;
                
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(x, z, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            
            if (boss) {
                const x = (boss.mesh.position.x + 250) * scale;
                const z = (boss.mesh.position.z + 250) * scale;
                
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(x, z, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            
            lootBoxes.forEach(loot => {
                if (loot.collected) return;
                const x = (loot.mesh.position.x + 250) * scale;
                const z = (loot.mesh.position.z + 250) * scale;
                
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(x, z, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('healthDisplay').textContent = Math.max(0, Math.round(health));
            document.getElementById('killDisplay').textContent = kills;
        }

        function createExplosion(position) {
            for (let i = 0; i < 20; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.1, 4, 4),
                    new THREE.MeshBasicMaterial({ 
                        color: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                        transparent: true
                    })
                );
                particle.position.copy(position);
                scene.add(particle);
                
                particles.push({
                    mesh: particle,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        Math.random() * 10,
                        (Math.random() - 0.5) * 20
                    ),
                    life: 1,
                    maxLife: 1
                });
            }
        }

        function dropLoot(position) {
            const lootBox = new THREE.Group();
            
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 0.8),
                new THREE.MeshStandardMaterial({ 
                    color: 0xffd700,
                    metalness: 0.5
                })
            );
            lootBox.add(box);
            
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(1, 8, 8),
                new THREE.MeshStandardMaterial({
                    color: 0xffff00,
                    transparent: true,
                    opacity: 0.3
                })
            );
            lootBox.add(glow);
            
            lootBox.position.copy(position);
            lootBox.position.y = 0.5;
            
            scene.add(lootBox);
            lootBoxes.push({
                mesh: lootBox,
                collected: false
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ====== GAME CONTROL ======
        function joinGame() {
            document.getElementById('lobby').style.display = 'none';
            gameRunning = true;
            lastTime = performance.now();
        }

        function gameOver() {
            gameRunning = false;
            alert(`💀 GAME OVER!\nĐiểm: ${score}\nKill: ${kills}`);
            window.location.reload();
        }

        function resetGame() {
            window.location.reload();
        }
    </script>
</body>
</html>
