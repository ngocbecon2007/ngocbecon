<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngọc Becon - Game Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Playfair+Display:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a2e;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ====== PARTICLES BACKGROUND ====== */
        #particles-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #1a0533, #2d1b69, #4a1942, #1a0533, #2d1b69, #4a1942);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 50% 0%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 100%; }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #ff69b4, #ff1493, transparent);
            opacity: 0.5;
            animation: particleFloat 25s infinite;
            pointer-events: none;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-150px) translateX(80px) rotate(180deg) scale(1.2); }
            50% { transform: translateY(-300px) translateX(-80px) rotate(360deg) scale(0.8); }
            75% { transform: translateY(-150px) translateX(120px) rotate(540deg) scale(1.1); }
        }

        /* ====== HEADER ====== */
        .header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .header-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ff6b9d, #ff1493);
            background-size: 300% 300%;
            animation: gradientMove 3s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: 0 auto 20px;
            box-shadow: 0 0 80px rgba(255, 20, 147, 0.6);
            position: relative;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header-logo::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid rgba(255, 105, 180, 0.4);
            animation: ringExpand 3s ease-out infinite;
        }

        @keyframes ringExpand {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ff6b9d, #ff1493, #ff69b4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 3s ease infinite;
            margin-bottom: 10px;
        }

        .header-subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        /* ====== GAME SELECTION ====== */
        .game-select {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .game-btn {
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .game-btn:hover {
            border-color: #ff69b4;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.3);
        }

        .game-btn.active {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            border-color: #ff69b4;
            box-shadow: 0 10px 40px rgba(255, 20, 147, 0.5);
        }

        .game-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: btnShine 3s ease-in-out infinite;
        }

        @keyframes btnShine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        /* ====== GAME CONTAINER ====== */
        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-frame {
            width: 100%;
            height: 600px;
            border-radius: 30px;
            overflow: hidden;
            border: 3px solid rgba(255, 105, 180, 0.3);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
            position: relative;
            background: #1a1a2e;
        }

        .game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #1a1a2e;
        }

        /* ====== GAME INFO ====== */
        .game-info {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            width: 100%;
            border: 2px solid rgba(255, 105, 180, 0.3);
        }

        .game-info-title {
            font-size: 1.3rem;
            color: #ff69b4;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-info-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        .game-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .control-key {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 105, 180, 0.3);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: monospace;
            color: #ff69b4;
        }

        /* ====== FOOTER ====== */
        footer {
            padding: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            margin-top: auto;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #ff69b4;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .back-link:hover {
            transform: scale(1.1);
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 768px) {
            .header-title { font-size: 2.5rem; }
            .header-logo { width: 100px; height: 100px; font-size: 45px; }
            .header-logo::after { width: 120px; height: 120px; }
            .game-frame { height: 450px; }
            .game-btn { padding: 12px 20px; font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .header-title { font-size: 2rem; }
            .header-logo { width: 80px; height: 80px; font-size: 35px; }
            .header-logo::after { width: 100px; height: 100px; }
            .game-frame { height: 350px; }
            .game-btn { padding: 10px 15px; font-size: 0.9rem; }
            .game-info { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- 3D Particles Background -->
    <div id="particles-3d"></div>

    <!-- HEADER -->
    <div class="header">
        <div class="header-logo">🎮</div>
        <h1 class="header-title">Ngọc Becon Game Hub</h1>
        <p class="header-subtitle">✨ Chọn game và chơi ngay! ✨</p>
    </div>

    <!-- GAME SELECTION -->
    <div class="game-select">
        <button class="game-btn active" onclick="selectGame('shooter')">🔫 Bắn Súng</button>
        <button class="game-btn" onclick="selectGame('snake')">🐍 Rắn Săn Mồi</button>
        <button class="game-btn" onclick="selectGame('pong')">🏓 Pong</button>
        <button class="game-btn" onclick="selectGame('breakout')">🧱 Breakout</button>
        <button class="game-btn" onclick="selectGame('flappy')">🐦 Flappy Bird</button>
        <button class="game-btn" onclick="selectGame('memory')">🧠 Memory</button>
    </div>

    <!-- GAME CONTAINER -->
    <div class="game-container">
        <div class="game-frame">
            <canvas id="gameCanvas" class="game-canvas"></canvas>
        </div>

        <!-- GAME INFO -->
        <div class="game-info">
            <div class="game-info-title" id="gameTitle">🔫 Bắn Súng</div>
            <div class="game-info-text" id="gameDesc">
                Click để bắn! Di chuyển bằng WASD hoặc mũi tên. Tiêu diệt quái vật để ghi điểm!
            </div>
            <div class="game-controls" id="gameControls">
                <span class="control-key">WASD / ↑↓←→</span>
                <span class="control-key">Click = Bắn</span>
                <span class="control-key">Space = Nhảy</span>
            </div>
        </div>
    </div>

    <footer>
        Made with ♡ by Ngọc Becon ✨
        <br>
        <a href="index.html" class="back-link">← Quay lại trang chính</a>
    </footer>

    <script>
        // Chặn phóng to thu nhỏ
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        });

        // Tạo particles
        function createParticles() {
            const container = document.getElementById('particles-3d');
            for (let i = 0; i < 70; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 30 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 25 + 's';
                particle.style.animationDuration = Math.random() * 20 + 15 + 's';
                container.appendChild(particle);
            }
        }

        // ====== GAME MANAGER ======
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let currentGame = 'shooter';
        let animationId = null;
        let keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function resizeCanvas() {
            const frame = document.querySelector('.game-frame');
            canvas.width = frame.clientWidth;
            canvas.height = frame.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);

        function selectGame(game) {
            currentGame = game;
            
            document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.game-btn[onclick="selectGame('${game}')"]`).classList.add('active');

            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            resizeCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const gameInfo = {
                shooter: {
                    title: '🔫 Bắn Súng',
                    desc: 'Click để bắn! Di chuyển bằng WASD hoặc mũi tên. Tiêu diệt quái vật để ghi điểm!',
                    controls: ['WASD / ↑↓←→', 'Click = Bắn', 'Space = Nhảy']
                },
                snake: {
                    title: '🐍 Rắn Săn Mồi',
                    desc: 'Điều khiển rắn ăn mồi! Tránh va vào tường và chính mình!',
                    controls: ['↑↓←→ hoặc WASD', 'Ăn mồi để dài ra']
                },
                pong: {
                    title: '🏓 Pong',
                    desc: 'Đánh bóng qua lại! Di chuyển thanh để không bị thủng lưới!',
                    controls: ['↑↓ = Di chuyển', 'Chơi với máy']
                },
                breakout: {
                    title: '🧱 Breakout',
                    desc: 'Phá vỡ tất cả gạch! Di chuyển thanh để hứng bóng!',
                    controls: ['←→ = Di chuyển', 'Phá hết gạch để thắng']
                },
                flappy: {
                    title: '🐦 Flappy Bird',
                    desc: 'Click để bay! Tránh các ống nước!',
                    controls: ['Click / Space = Bay', 'Tránh chướng ngại vật']
                },
                memory: {
                    title: '🧠 Memory Game',
                    desc: 'Tìm các cặp thẻ giống nhau! Nhớ vị trí các thẻ!',
                    controls: ['Click = Lật thẻ', 'Tìm tất cả cặp']
                }
            };

            document.getElementById('gameTitle').textContent = gameInfo[game].title;
            document.getElementById('gameDesc').textContent = gameInfo[game].desc;
            document.getElementById('gameControls').innerHTML = gameInfo[game].controls
                .map(c => `<span class="control-key">${c}</span>`)
                .join('');

            switch(game) {
                case 'shooter': initShooter(); break;
                case 'snake': initSnake(); break;
                case 'pong': initPong(); break;
                case 'breakout': initBreakout(); break;
                case 'flappy': initFlappy(); break;
                case 'memory': initMemory(); break;
            }
        }

        // ====== GAME 1: SHOOTER ======
        let shooterState;

        function initShooter() {
            shooterState = {
                player: { x: canvas.width/2, y: canvas.height/2, radius: 20, speed: 5 },
                bullets: [],
                enemies: [],
                score: 0,
                gameOver: false,
                lastShot: 0
            };

            // Tạo enemies
            for (let i = 0; i < 5; i++) {
                spawnEnemy();
            }

            gameLoop();
        }

        function spawnEnemy() {
            const enemy = {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: 15 + Math.random() * 10,
                speed: 1 + Math.random() * 2,
                angle: Math.random() * Math.PI * 2,
                color: `hsl(${Math.random() * 360}, 70%, 50%)`
            };
            shooterState.enemies.push(enemy);
        }

        canvas.addEventListener('click', (e) => {
            if (currentGame !== 'shooter' || !shooterState || shooterState.gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const angle = Math.atan2(mouseY - shooterState.player.y, mouseX - shooterState.player.x);
            shooterState.bullets.push({
                x: shooterState.player.x,
                y: shooterState.player.y,
                vx: Math.cos(angle) * 10,
                vy: Math.sin(angle) * 10,
                radius: 5
            });
        });

        function updateShooter() {
            const state = shooterState;
            if (state.gameOver) return;

            // Di chuyển player
            if (keys['w'] || keys['arrowup']) state.player.y -= state.player.speed;
            if (keys['s'] || keys['arrowdown']) state.player.y += state.player.speed;
            if (keys['a'] || keys['arrowleft']) state.player.x -= state.player.speed;
            if (keys['d'] || keys['arrowright']) state.player.x += state.player.speed;

            // Giới hạn trong canvas
            state.player.x = Math.max(state.player.radius, Math.min(canvas.width - state.player.radius, state.player.x));
            state.player.y = Math.max(state.player.radius, Math.min(canvas.height - state.player.radius, state.player.y));

            // Di chuyển bullets
            state.bullets = state.bullets.filter(bullet => {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                return bullet.x > 0 && bullet.x < canvas.width && bullet.y > 0 && bullet.y < canvas.height;
            });

            // Di chuyển enemies
            state.enemies.forEach(enemy => {
                enemy.angle += 0.02;
                enemy.x += Math.cos(enemy.angle) * enemy.speed;
                enemy.y += Math.sin(enemy.angle) * enemy.speed;

                // Giữ trong canvas
                enemy.x = Math.max(enemy.radius, Math.min(canvas.width - enemy.radius, enemy.x));
                enemy.y = Math.max(enemy.radius, Math.min(canvas.height - enemy.radius, enemy.y));
            });

            // Bắn trúng enemy
            state.bullets.forEach(bullet => {
                state.enemies.forEach((enemy, index) => {
                    const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    if (dist < bullet.radius + enemy.radius) {
                        state.enemies.splice(index, 1);
                        state.score += 10;
                        spawnEnemy();
                    }
                });
            });

            // Enemy chạm player
            state.enemies.forEach(enemy => {
                const dist = Math.hypot(enemy.x - state.player.x, enemy.y - state.player.y);
                if (dist < enemy.radius + state.player.radius) {
                    state.gameOver = true;
                }
            });
        }

        function drawShooter() {
            const state = shooterState;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ player
            ctx.beginPath();
            ctx.arc(state.player.x, state.player.y, state.player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff69b4';
            ctx.fill();
            ctx.strokeStyle = '#ff1493';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Vẽ bullets
            state.bullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffff00';
                ctx.fill();
            });

            // Vẽ enemies
            state.enemies.forEach(enemy => {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fillStyle = enemy.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Vẽ score
            ctx.fillStyle = 'white';
            ctx.font = '30px Poppins';
            ctx.fillText(`Điểm: ${state.score}`, 20, 40);

            // Game over
            if (state.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Poppins';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER!', canvas.width/2, canvas.height/2 - 30);
                ctx.font = '25px Poppins';
                ctx.fillText(`Điểm: ${state.score}`, canvas.width/2, canvas.height/2 + 20);
                ctx.fillText('Click để chơi lại', canvas.width/2, canvas.height/2 + 60);
                ctx.textAlign = 'left';
            }
        }

        // ====== GAME 2: SNAKE ======
        let snakeState;

        function initSnake() {
            const gridSize = 20;
            snakeState = {
                snake: [{x: 5, y: 5}],
                direction: {x: 1, y: 0},
                food: {x: 10, y: 10},
                score: 0,
                gameOver: false,
                gridSize: gridSize
            };

            placeFood();
            gameLoop();
        }

        function placeFood() {
            snakeState.food = {
                x: Math.floor(Math.random() * (canvas.width / snakeState.gridSize)),
                y: Math.floor(Math.random() * (canvas.height / snakeState.gridSize))
            };
        }

        function updateSnake() {
            const state = snakeState;
            if (state.gameOver) return;

            // Đổi hướng
            if (keys['w'] || keys['arrowup']) if (state.direction.y !== 1) state.direction = {x: 0, y: -1};
            if (keys['s'] || keys['arrowdown']) if (state.direction.y !== -1) state.direction = {x: 0, y: 1};
            if (keys['a'] || keys['arrowleft']) if (state.direction.x !== 1) state.direction = {x: -1, y: 0};
            if (keys['d'] || keys['arrowright']) if (state.direction.x !== -1) state.direction = {x: 1, y: 0};

            // Di chuyển
            const head = {
                x: state.snake[0].x + state.direction.x,
                y: state.snake[0].y + state.direction.y
            };

            // Kiểm tra va chạm
            if (head.x < 0 || head.x >= canvas.width / state.gridSize ||
                head.y < 0 || head.y >= canvas.height / state.gridSize) {
                state.gameOver = true;
                return;
            }

            state.snake.unshift(head);

            // Ăn food
            if (head.x === state.food.x && head.y === state.food.y) {
                state.score += 10;
                placeFood();
            } else {
                state.snake.pop();
            }

            // Tự va chạm
            for (let i = 1; i < state.snake.length; i++) {
                if (head.x === state.snake[i].x && head.y === state.snake[i].y) {
                    state.gameOver = true;
                    return;
                }
            }
        }

        function drawSnake() {
            const state = snakeState;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cellSize = state.gridSize;

            // Vẽ food
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(state.food.x * cellSize, state.food.y * cellSize, cellSize, cellSize);

            // Vẽ snake
            state.snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#00ff88' : '#00cc66';
                ctx.fillRect(segment.x * cellSize, segment.y * cellSize, cellSize - 2, cellSize - 2);
            });

            // Vẽ score
            ctx.fillStyle = 'white';
            ctx.font = '30px Poppins';
            ctx.fillText(`Điểm: ${state.score}`, 20, 40);

            // Game over
            if (state.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Poppins';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER!', canvas.width/2, canvas.height/2 - 30);
                ctx.font = '25px Poppins';
                ctx.fillText(`Điểm: ${state.score}`, canvas.width/2, canvas.height/2 + 20);
                ctx.fillText('Click để chơi lại', canvas.width/2, canvas.height/2 + 60);
                ctx.textAlign = 'left';
            }
        }

        // ====== GAME 3: PONG ======
        let pongState;

        function initPong() {
            pongState = {
                player: { y: canvas.height/2 - 50, width: 15, height: 100, speed: 7 },
                ai: { y: canvas.height/2 - 50, width: 15, height: 100, speed: 4 },
                ball: { x: canvas.width/2, y: canvas.height/2, vx: 5, vy: 3, radius: 10 },
                playerScore: 0,
                aiScore: 0,
                gameOver: false
            };

            gameLoop();
        }

        function updatePong() {
            const state = pongState;
            if (state.gameOver) return;

            // Di chuyển player
            if (keys['w'] || keys['arrowup']) state.player.y -= state.player.speed;
            if (keys['s'] || keys['arrowdown']) state.player.y += state.player.speed;

            // Giới hạn
            state.player.y = Math.max(0, Math.min(canvas.height - state.player.height, state.player.y));

            // AI di chuyển
            const aiCenter = state.ai.y + state.ai.height/2;
            if (aiCenter < state.ball.y) state.ai.y += state.ai.speed;
            if (aiCenter > state.ball.y) state.ai.y -= state.ai.speed;
            state.ai.y = Math.max(0, Math.min(canvas.height - state.ai.height, state.ai.y));

            // Ball di chuyển
            state.ball.x += state.ball.vx;
            state.ball.y += state.ball.vy;

            // Va chạm trên dưới
            if (state.ball.y < 0 || state.ball.y > canvas.height) {
                state.ball.vy *= -1;
            }

            // Va chạm player
            if (state.ball.x - state.ball.radius < state.player.x + state.player.width &&
                state.ball.x + state.ball.radius > state.player.x &&
                state.ball.y > state.player.y && state.ball.y < state.player.y + state.player.height) {
                state.ball.vx = Math.abs(state.ball.vx);
                state.ball.vx += 0.5;
            }

            // Va chạm AI
            if (state.ball.x + state.ball.radius > state.ai.x &&
                state.ball.x - state.ball.radius < state.ai.x + state.ai.width &&
                state.ball.y > state.ai.y && state.ball.y < state.ai.y + state.ai.height) {
                state.ball.vx = -Math.abs(state.ball.vx);
                state.ball.vx -= 0.5;
            }

            // Ghi điểm
            if (state.ball.x < 0) {
                state.aiScore++;
                resetBall();
            }
            if (state.ball.x > canvas.width) {
                state.playerScore++;
                resetBall();
            }

            if (state.playerScore >= 10 || state.aiScore >= 10) {
                state.gameOver = true;
            }
        }

        function resetBall() {
            pongState.ball.x = canvas.width/2;
            pongState.ball.y = canvas.height/2;
            pongState.ball.vx = 5 * (Math.random() > 0.5 ? 1 : -1);
            pongState.ball.vy = 3 * (Math.random() > 0.5 ? 1 : -1);
        }

        function drawPong() {
            const state = pongState;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ đường giữa
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, 0);
            ctx.lineTo(canvas.width/2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Vẽ player
            ctx.fillStyle = '#ff69b4';
            ctx.fillRect(0, state.player.y, state.player.width, state.player.height);

            // Vẽ AI
            ctx.fillStyle = '#20d5ff';
            ctx.fillRect(canvas.width - state.ai.width, state.ai.y, state.ai.width, state.ai.height);

            // Vẽ ball
            ctx.beginPath();
            ctx.arc(state.ball.x, state.ball.y, state.ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();

            // Vẽ score
            ctx.fillStyle = 'white';
            ctx.font = '40px Poppins';
            ctx.textAlign = 'center';
            ctx.fillText(`${state.playerScore} : ${state.aiScore}`, canvas.width/2, 50);
            ctx.textAlign = 'left';

            // Game over
            if (state.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Poppins';
                ctx.textAlign = 'center';
                ctx.fillText(state.playerScore > state.aiScore ? 'BẠN THẮNG!' : 'BẠN THUA!', canvas.width/2, canvas.height/2 - 30);
                ctx.font = '25px Poppins';
                ctx.fillText('Click để chơi lại', canvas.width/2, canvas.height/2 + 30);
                ctx.textAlign = 'left';
            }
        }

        // ====== GAME 4: BREAKOUT ======
        let breakoutState;

        function initBreakout() {
            breakoutState = {
                paddle: { x: canvas.width/2 - 50, y: canvas.height - 30, width: 100, height: 15, speed: 7 },
                ball: { x: canvas.width/2, y: canvas.height - 50, vx: 4, vy: -4, radius: 8 },
                bricks: [],
                score: 0,
                lives: 3,
                gameOver: false
            };

            // Tạo bricks
            const rows = 5;
            const cols = 8;
            const brickWidth = (canvas.width - 40) / cols;
            const brickHeight = 25;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    breakoutState.bricks.push({
                        x: 20 + col * brickWidth,
                        y: 50 + row * (brickHeight + 10),
                        width: brickWidth - 5,
                        height: brickHeight,
                        alive: true,
                        color: `hsl(${row * 40}, 70%, 50%)`
                    });
                }
            }

            gameLoop();
        }

        function updateBreakout() {
            const state = breakoutState;
            if (state.gameOver) return;

            // Di chuyển paddle
            if (keys['a'] || keys['arrowleft']) state.paddle.x -= state.paddle.speed;
            if (keys['d'] || keys['arrowright']) state.paddle.x += state.paddle.speed;
            state.paddle.x = Math.max(0, Math.min(canvas.width - state.paddle.width, state.paddle.x));

            // Ball di chuyển
            state.ball.x += state.ball.vx;
            state.ball.y += state.ball.vy;

            // Va chạm tường
            if (state.ball.x < 0 || state.ball.x > canvas.width) state.ball.vx *= -1;
            if (state.ball.y < 0) state.ball.vy *= -1;

            // Va chạm paddle
            if (state.ball.y + state.ball.radius > state.paddle.y &&
                state.ball.y - state.ball.radius < state.paddle.y + state.paddle.height &&
                state.ball.x > state.paddle.x && state.ball.x < state.paddle.x + state.paddle.width) {
                state.ball.vy = -Math.abs(state.ball.vy);
            }

            // Va chạm bricks
            state.bricks.forEach(brick => {
                if (!brick.alive) return;
                if (state.ball.x > brick.x && state.ball.x < brick.x + brick.width &&
                    state.ball.y > brick.y && state.ball.y < brick.y + brick.height) {
                    brick.alive = false;
                    state.ball.vy *= -1;
                    state.score += 10;
                }
            });

            // Rơi xuống
            if (state.ball.y > canvas.height) {
                state.lives--;
                state.ball.x = canvas.width/2;
                state.ball.y = canvas.height - 50;
                state.ball.vx = 4 * (Math.random() > 0.5 ? 1 : -1);
                state.ball.vy = -4;
                if (state.lives <= 0) state.gameOver = true;
            }

            // Thắng
            if (state.bricks.every(brick => !brick.alive)) {
                state.gameOver = true;
            }
        }

        function drawBreakout() {
            const state = breakoutState;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ bricks
            state.bricks.forEach(brick => {
                if (!brick.alive) return;
                ctx.fillStyle = brick.color;
                ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
            });

            // Vẽ paddle
            ctx.fillStyle = '#ff69b4';
            ctx.fillRect(state.paddle.x, state.paddle.y, state.paddle.width, state.paddle.height);

            // Vẽ ball
            ctx.beginPath();
            ctx.arc(state.ball.x, state.ball.y, state.ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();

            // Vẽ score
            ctx.fillStyle = 'white';
            ctx.font = '25px Poppins';
            ctx.fillText(`Điểm: ${state.score}`, 20, 30);
            ctx.fillText(`Mạng: ${state.lives}`, canvas.width - 100, 30);

            // Game over
            if (state.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Poppins';
                ctx.textAlign = 'center';
                ctx.fillText(state.lives > 0 ? 'BẠN THẮNG!' : 'GAME OVER!', canvas.width/2, canvas.height/2 - 30);
                ctx.font = '25px Poppins';
                ctx.fillText(`Điểm: ${state.score}`, canvas.width/2, canvas.height/2 + 20);
                ctx.fillText('Click để chơi lại', canvas.width/2, canvas.height/2 + 60);
                ctx.textAlign = 'left';
            }
        }

        // ====== GAME 5: FLAPPY BIRD ======
        let flappyState;

        function initFlappy() {
            flappyState = {
                bird: { x: 50, y: canvas.height/2, vy: 0, radius: 15, gravity: 0.5, jump: -8 },
                pipes: [],
                score: 0,
                gameOver: false,
                pipeSpeed: 3,
                pipeGap: 150,
                pipeWidth: 60
            };

            gameLoop();
        }

        canvas.addEventListener('click', (e) => {
            if (currentGame === 'flappy' && flappyState && !flappyState.gameOver) {
                flappyState.bird.vy = flappyState.bird.jump;
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && currentGame === 'flappy' && flappyState && !flappyState.gameOver) {
                flappyState.bird.vy = flappyState.bird.jump;
            }
        });

        function updateFlappy() {
            const state = flappyState;
            if (state.gameOver) return;

            // Bird vật lý
            state.bird.vy += state.bird.gravity;
            state.bird.y += state.bird.vy;

            // Tạo pipes
            if (state.pipes.length === 0 || state.pipes[state.pipes.length - 1].x < canvas.width - 200) {
                const gapY = 50 + Math.random() * (canvas.height - 200);
                state.pipes.push({
                    x: canvas.width,
                    gapY: gapY,
                    width: state.pipeWidth,
                    gapHeight: state.pipeGap
                });
            }

            // Di chuyển pipes
            state.pipes.forEach(pipe => pipe.x -= state.pipeSpeed);
            state.pipes = state.pipes.filter(pipe => pipe.x > -state.pipeWidth);

            // Va chạm
            state.pipes.forEach(pipe => {
                if (state.bird.x + state.bird.radius > pipe.x && 
                    state.bird.x - state.bird.radius < pipe.x + pipe.width) {
                    if (state.bird.y < pipe.gapY || state.bird.y > pipe.gapY + pipe.gapHeight) {
                        state.gameOver = true;
                    }
                }
            });

            // Va chạm trên dưới
            if (state.bird.y < 0 || state.bird.y > canvas.height) {
                state.gameOver = true;
            }

            // Ghi điểm
            state.pipes.forEach(pipe => {
                if (!pipe.passed && pipe.x + pipe.width < state.bird.x) {
                    pipe.passed = true;
                    state.score++;
                }
            });
        }

        function drawFlappy() {
            const state = flappyState;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ bird
            ctx.beginPath();
            ctx.arc(state.bird.x, state.bird.y, state.bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.strokeStyle = '#ff8c00';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Vẽ pipes
            state.pipes.forEach(pipe => {
                // Trên
                ctx.fillStyle = '#00cc66';
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.gapY);
                // Dưới
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(pipe.x, pipe.gapY + pipe.gapHeight, pipe.width, canvas.height - pipe.gapY - pipe.gapHeight);
            });

            // Vẽ score
            ctx.fillStyle = 'white';
            ctx.font = '30px Poppins';
            ctx.textAlign = 'center';
            ctx.fillText(`Điểm: ${state.score}`, canvas.width/2, 50);
            ctx.textAlign = 'left';

            // Game over
            if (state.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Poppins';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER!', canvas.width/2, canvas.height/2 - 30);
                ctx.font = '25px Poppins';
                ctx.fillText(`Điểm: ${state.score}`, canvas.width/2, canvas.height/2 + 20);
                ctx.fillText('Click để chơi lại', canvas.width/2, canvas.height/2 + 60);
                ctx.textAlign = 'left';
            }
        }

        // ====== GAME 6: MEMORY ======
        let memoryState;

        function initMemory() {
            const emojis = ['🌸', '💖', '✨', '⭐', '🎮', '🌈', '🔥', '💎'];
            const cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);

            memoryState = {
                cards: cards.map((emoji, index) => ({
                    emoji: emoji,
                    flipped: false,
                    matched: false,
                    x: 0,
                    y: 0,
                    width: 0,
                    height: 0
                })),
                firstCard: null,
                secondCard: null,
                moves: 0,
                matchedPairs: 0,
                gameOver: false,
                lockBoard: false
            };

            // Tính kích thước card
            const cols = 4;
            const rows = 4;
            const padding = 20;
            const gap = 10;
            const cardWidth = (canvas.width - padding * 2 - gap * (cols - 1)) / cols;
            const cardHeight = (canvas.height - padding * 2 - gap * (rows - 1)) / rows;

            memoryState.cards.forEach((card, index) => {
                const row = Math.floor(index / cols);
                const col = index % cols;
                card.x = padding + col * (cardWidth + gap);
                card.y = padding + row * (cardHeight + gap);
                card.width = cardWidth;
                card.height = cardHeight;
            });

            gameLoop();
        }

        canvas.addEventListener('click', (e) => {
            if (currentGame !== 'memory' || !memoryState || memoryState.lockBoard) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            memoryState.cards.forEach(card => {
                if (card.flipped || card.matched) return;
                if (mouseX > card.x && mouseX < card.x + card.width &&
                    mouseY > card.y && mouseY < card.y + card.height) {
                    flipCard(card);
                }
            });
        });

        function flipCard(card) {
            const state = memoryState;
            card.flipped = true;
            state.moves++;

            if (!state.firstCard) {
                state.firstCard = card;
            } else if (!state.secondCard) {
                state.secondCard = card;
                state.lockBoard = true;

                if (state.firstCard.emoji === state.secondCard.emoji) {
                    state.firstCard.matched = true;
                    state.secondCard.matched = true;
                    state.matchedPairs++;
                    state.firstCard = null;
                    state.secondCard = null;
                    state.lockBoard = false;

                    if (state.matchedPairs === 8) {
                        state.gameOver = true;
                    }
                } else {
                    setTimeout(() => {
                        state.firstCard.flipped = false;
                        state.secondCard.flipped = false;
                        state.firstCard = null;
                        state.secondCard = null;
                        state.lockBoard = false;
                    }, 1000);
                }
            }
        }

        function drawMemory() {
            const state = memoryState;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            state.cards.forEach(card => {
                if (card.flipped || card.matched) {
                    // Vẽ mặt trước
                    ctx.fillStyle = card.matched ? 'rgba(0,255,136,0.3)' : '#ff69b4';
                    ctx.fillRect(card.x, card.y, card.width, card.height);
                    ctx.strokeStyle = card.matched ? '#00ff88' : '#ff1493';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(card.x, card.y, card.width, card.height);

                    ctx.fillStyle = 'white';
                    ctx.font = `${Math.min(card.width, card.height) * 0.5}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(card.emoji, card.x + card.width/2, card.y + card.height/2);
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'alphabetic';
                } else {
                    // Vẽ mặt sau
                    ctx.fillStyle = '#2d1b69';
                    ctx.fillRect(card.x, card.y, card.width, card.height);
                    ctx.strokeStyle = '#ff69b4';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(card.x, card.y, card.width, card.height);

                    ctx.fillStyle = 'rgba(255,105,180,0.5)';
                    ctx.font = `${Math.min(card.width, card.height) * 0.4}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('?', card.x + card.width/2, card.y + card.height/2);
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'alphabetic';
                }
            });

            // Vẽ moves
            ctx.fillStyle = 'white';
            ctx.font = '25px Poppins';
            ctx.fillText(`Lượt: ${state.moves}`, 20, 30);

            // Game over
            if (state.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Poppins';
                ctx.textAlign = 'center';
                ctx.fillText('BẠN THẮNG!', canvas.width/2, canvas.height/2 - 30);
                ctx.font = '25px Poppins';
                ctx.fillText(`Lượt: ${state.moves}`, canvas.width/2, canvas.height/2 + 20);
                ctx.fillText('Click để chơi lại', canvas.width/2, canvas.height/2 + 60);
                ctx.textAlign = 'left';
            }
        }

        // ====== GAME LOOP ======
        function gameLoop() {
            switch(currentGame) {
                case 'shooter':
                    updateShooter();
                    drawShooter();
                    break;
                case 'snake':
                    updateSnake();
                    drawSnake();
                    break;
                case 'pong':
                    updatePong();
                    drawPong();
                    break;
                case 'breakout':
                    updateBreakout();
                    drawBreakout();
                    break;
                case 'flappy':
                    updateFlappy();
                    drawFlappy();
                    break;
                case 'memory':
                    drawMemory();
                    break;
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // Click để chơi lại
        canvas.addEventListener('click', (e) => {
            const state = getCurrentGameState();
            if (state && state.gameOver) {
                selectGame(currentGame);
            }
        });

        function getCurrentGameState() {
            switch(currentGame) {
                case 'shooter': return shooterState;
                case 'snake': return snakeState;
                case 'pong': return pongState;
                case 'breakout': return breakoutState;
                case 'flappy': return flappyState;
                case 'memory': return memoryState;
            }
            return null;
        }

        // Khởi tạo
        createParticles();
        resizeCanvas();
        selectGame('shooter');
    </script>
</body>
