<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngọc Becon - 3D Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Playfair+Display:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a2e;
            color: white;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ====== PARTICLES BACKGROUND ====== */
        #particles-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #1a0533, #2d1b69, #4a1942, #1a0533, #2d1b69, #4a1942);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 50% 0%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 100%; }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #ff69b4, #ff1493, transparent);
            opacity: 0.5;
            animation: particleFloat 25s infinite;
            pointer-events: none;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-150px) translateX(80px) rotate(180deg) scale(1.2); }
            50% { transform: translateY(-300px) translateX(-80px) rotate(360deg) scale(0.8); }
            75% { transform: translateY(-150px) translateX(120px) rotate(540deg) scale(1.1); }
        }

        /* ====== GAME CONTAINER ====== */
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ====== HUD ====== */
        #hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255, 105, 180, 0.3);
        }

        .hud-item {
            text-align: center;
        }

        .hud-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .hud-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ff69b4;
        }

        /* ====== JOYSTICK ====== */
        #joystickArea {
            position: fixed;
            bottom: 100px;
            left: 30px;
            width: 150px;
            height: 150px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 3px solid rgba(255, 105, 180, 0.5);
            backdrop-filter: blur(10px);
            touch-action: none;
        }

        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.5);
            pointer-events: none;
        }

        /* ====== ACTION BUTTONS ====== */
        #actionButtons {
            position: fixed;
            bottom: 100px;
            right: 30px;
            z-index: 100;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 105, 180, 0.3);
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

        .action-btn:active {
            transform: scale(0.9);
            background: rgba(255, 20, 147, 0.5);
        }

        .action-btn.jump {
            width: 80px;
            height: 80px;
            background: rgba(255, 215, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .action-btn.jump:active {
            background: rgba(255, 215, 0, 0.6);
        }

        /* ====== GAME MENU ====== */
        #gameMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: cardEntrance 1s ease-out forwards;
            opacity: 0;
        }

        @keyframes cardEntrance {
            0% { 
                opacity: 0;
                transform: translateZ(-400px) rotateX(45deg) scale(0.5);
                filter: blur(10px);
            }
            100% { 
                opacity: 1;
                transform: translateZ(0) rotateX(0deg) scale(1);
                filter: blur(0);
            }
        }

        .menu-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ff6b9d, #ff1493);
            background-size: 300% 300%;
            animation: gradientMove 3s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: 0 auto 30px;
            box-shadow: 0 0 80px rgba(255, 20, 147, 0.6);
            position: relative;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .menu-logo::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid rgba(255, 105, 180, 0.4);
            animation: ringExpand 3s ease-out infinite;
        }

        @keyframes ringExpand {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .menu-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ff6b9d, #ff1493, #ff69b4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 3s ease infinite;
            margin-bottom: 20px;
        }

        .menu-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(255, 20, 147, 0.5);
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: btnShine 3s ease-in-out infinite;
        }

        @keyframes btnShine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .menu-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 60px rgba(255, 20, 147, 0.8);
        }

        .menu-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .menu-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 105, 180, 0.3);
            box-shadow: none;
        }

        .menu-btn.secondary:hover {
            background: rgba(255, 105, 180, 0.2);
            border-color: #ff69b4;
        }

        .menu-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }

        .stat-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff69b4;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #ff69b4;
            transform: scale(1.1);
        }

        /* ====== GAME OVER ====== */
        #gameOver {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
        }

        .gameover-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            border: 2px solid rgba(255, 105, 180, 0.3);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .gameover-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
        }

        .gameover-score {
            font-size: 2rem;
            color: #ff69b4;
            margin-bottom: 30px;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 768px) {
            #hud {
                top: 10px;
                padding: 8px 15px;
                gap: 15px;
            }
            .hud-value { font-size: 1rem; }
            .hud-label { font-size: 0.7rem; }
            
            #joystickArea {
                bottom: 80px;
                left: 20px;
                width: 120px;
                height: 120px;
            }
            #joystickKnob {
                width: 50px;
                height: 50px;
            }
            
            #actionButtons {
                bottom: 80px;
                right: 20px;
                gap: 10px;
            }
            .action-btn {
                width: 55px;
                height: 55px;
                font-size: 1.2rem;
            }
            .action-btn.jump {
                width: 65px;
                height: 65px;
            }
            
            .menu-card { padding: 30px; }
            .menu-title { font-size: 2.5rem; }
            .menu-logo { width: 100px; height: 100px; font-size: 45px; }
            .menu-logo::after { width: 120px; height: 120px; }
        }

        @media (max-width: 480px) {
            #joystickArea {
                bottom: 70px;
                left: 15px;
                width: 100px;
                height: 100px;
            }
            #joystickKnob {
                width: 40px;
                height: 40px;
            }
            
            #actionButtons {
                bottom: 70px;
                right: 15px;
            }
            .action-btn {
                width: 45px;
                height: 45px;
                font-size: 1rem;
            }
            .action-btn.jump {
                width: 55px;
                height: 55px;
            }
            
            .menu-card { padding: 25px; }
            .menu-title { font-size: 2rem; }
            .menu-subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- 3D Particles Background -->
    <div id="particles-3d"></div>

    <!-- GAME CONTAINER -->
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-item">
            <div class="hud-label">Điểm</div>
            <div class="hud-value" id="scoreDisplay">0</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Máu</div>
            <div class="hud-value" id="healthDisplay">100</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">Kill</div>
            <div class="hud-value" id="killDisplay">0</div>
        </div>
    </div>

    <!-- JOYSTICK -->
    <div id="joystickArea">
        <div id="joystickKnob"></div>
    </div>

    <!-- ACTION BUTTONS -->
    <div id="actionButtons">
        <button class="action-btn" id="attackBtn">⚔️</button>
        <button class="action-btn jump" id="jumpBtn">⬆️</button>
    </div>

    <!-- GAME MENU -->
    <div id="gameMenu">
        <div class="menu-card">
            <div class="menu-logo">🎮</div>
            <h1 class="menu-title">Ngọc Becon 3D</h1>
            <p class="menu-subtitle">✨ Game bắn súng 3D online ✨</p>
            
            <div class="menu-stats">
                <div class="stat-box">
                    <div class="stat-label">Kill</div>
                    <div class="stat-value" id="totalKills">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Điểm</div>
                    <div class="stat-value" id="totalScore">0</div>
                </div>
            </div>
            
            <button class="menu-btn" onclick="startGame()">▶️ CHƠI NGAY</button>
            <button class="menu-btn secondary" onclick="window.location.href='index.html'">🏠 Trang Chính</button>
            <a href="index.html" class="back-link">← Quay lại</a>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOver">
        <div class="gameover-card">
            <h2 class="gameover-title">GAME OVER!</h2>
            <div class="gameover-score" id="finalScore">Điểm: 0</div>
            <button class="menu-btn" onclick="restartGame()">🔄 CHƠI LẠI</button>
            <button class="menu-btn secondary" onclick="backToMenu()">🏠 MENU</button>
        </div>
    </div>

    <script>
        // ====== CHẶN PHÓNG TO ======
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        });

        // ====== PARTICLES ======
        function createParticles() {
            const container = document.getElementById('particles-3d');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 20 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 25 + 's';
                particle.style.animationDuration = Math.random() * 20 + 15 + 's';
                container.appendChild(particle);
            }
        }

        // ====== THREE.JS 3D GAME ======
        // Sử dụng Three.js từ CDN
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
        script.onload = initGame;
        document.head.appendChild(script);

        let scene, camera, renderer;
        let player, enemies = [];
        let bullets = [];
        let particles = [];
        let score = 0;
        let kills = 0;
        let health = 100;
        let gameRunning = false;
        let gamePaused = false;
        let lastTime = 0;
        let joystickData = { active: false, x: 0, y: 0 };
        let isJumping = false;
        let playerVelocity = { x: 0, y: 0, z: 0 };
        let keys = {};

        // Tạo map
        let ground, obstacles = [];
        let trees = [];

        function initGame() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 100, 500);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 50);

            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 100, 50);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const hemisphereLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.5);
            scene.add(hemisphereLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(500, 500);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x4CAF50,
                roughness: 0.8
            });
            ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid
            const gridHelper = new THREE.GridHelper(500, 50, 0xff69b4, 0xff1493);
            gridHelper.position.y = 0.1;
            scene.add(gridHelper);

            // Trees
            for (let i = 0; i < 20; i++) {
                createTree(
                    Math.random() * 400 - 200,
                    Math.random() * 400 - 200
                );
            }

            // Rocks
            for (let i = 0; i < 10; i++) {
                createRock(
                    Math.random() * 400 - 200,
                    Math.random() * 400 - 200
                );
            }

            // Player
            createPlayer();

            // Enemies
            for (let i = 0; i < 5; i++) {
                spawnEnemy();
            }

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Joystick
            setupJoystick();

            // Action buttons
            document.getElementById('attackBtn').addEventListener('touchstart', attack);
            document.getElementById('attackBtn').addEventListener('mousedown', attack);
            document.getElementById('jumpBtn').addEventListener('touchstart', jump);
            document.getElementById('jumpBtn').addEventListener('mousedown', jump);

            // Start animation
            animate(0);
        }

        function createPlayer() {
            // Body
            const bodyGeometry = new THREE.BoxGeometry(2, 3, 1);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff69b4,
                metalness: 0.3,
                roughness: 0.4
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.5;
            body.castShadow = true;

            // Head
            const headGeometry = new THREE.SphereGeometry(0.8, 16, 16);
            const headMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffb6c1,
                metalness: 0.3,
                roughness: 0.4
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 3.5;
            head.castShadow = true;

            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.15, 8, 8);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
            
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.3, 3.6, 0.7);
            
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.3, 3.6, 0.7);

            // Gun
            const gunGeometry = new THREE.BoxGeometry(0.3, 0.3, 2);
            const gunMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                metalness: 0.8,
                roughness: 0.2
            });
            const gun = new THREE.Mesh(gunGeometry, gunMaterial);
            gun.position.set(0, 1.5, 1.5);
            gun.castShadow = true;

            // Group
            player = new THREE.Group();
            player.add(body);
            player.add(head);
            player.add(leftEye);
            player.add(rightEye);
            player.add(gun);
            player.position.set(0, 0, 0);
            scene.add(player);
        }

        function createTree(x, z) {
            const treeGroup = new THREE.Group();

            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.7, 3);
            const trunkMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B4513,
                roughness: 0.8
            });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 1.5;
            trunk.castShadow = true;

            // Leaves
            const leavesGeometry = new THREE.SphereGeometry(2, 8, 8);
            const leavesMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x228B22,
                roughness: 0.6
            });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 3.5;
            leaves.castShadow = true;

            treeGroup.add(trunk);
            treeGroup.add(leaves);
            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
            trees.push(treeGroup);
        }

        function createRock(x, z) {
            const rockGeometry = new THREE.DodecahedronGeometry(1.5, 1);
            const rockMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x808080,
                roughness: 0.9
            });
            const rock = new THREE.Mesh(rockGeometry, rockMaterial);
            rock.position.set(x, 0.5, z);
            rock.scale.y = 0.5;
            rock.castShadow = true;
            scene.add(rock);
            obstacles.push(rock);
        }

        function spawnEnemy() {
            const enemyGroup = new THREE.Group();

            // Body
            const bodyGeometry = new THREE.BoxGeometry(1.5, 2, 1);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff0000,
                metalness: 0.3,
                roughness: 0.4
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1;
            body.castShadow = true;

            // Head
            const headGeometry = new THREE.SphereGeometry(0.6, 16, 16);
            const headMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xcc0000,
                metalness: 0.3,
                roughness: 0.4
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 2.5;
            head.castShadow = true;

            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.25, 2.6, 0.55);
            
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.25, 2.6, 0.55);

            enemyGroup.add(body);
            enemyGroup.add(head);
            enemyGroup.add(leftEye);
            enemyGroup.add(rightEye);

            // Random position
            const angle = Math.random() * Math.PI * 2;
            const radius = 50 + Math.random() * 100;
            enemyGroup.position.set(
                player.position.x + Math.cos(angle) * radius,
                0,
                player.position.z + Math.sin(angle) * radius
            );

            scene.add(enemyGroup);
            enemies.push({
                mesh: enemyGroup,
                health: 100,
                speed: 3 + Math.random() * 3,
                attackRange: 5,
                attackCooldown: 0
            });
        }

        function attack() {
            if (!gameRunning || gamePaused) return;

            // Tạo bullet
            const bulletGeometry = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffff00,
                emissive: 0xffff00,
                emissiveIntensity: 0.5
            });
            const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
            bullet.position.copy(player.position);
            bullet.position.y = 2;

            // Hướng bắn
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(player.quaternion);

            scene.add(bullet);
            bullets.push({
                mesh: bullet,
                velocity: direction.multiplyScalar(50),
                life: 2
            });

            // Muzzle flash
            createMuzzleFlash();
        }

        function createMuzzleFlash() {
            const flashGeometry = new THREE.SphereGeometry(0.3, 8, 8);
            const flashMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffff00,
                transparent: true,
                opacity: 1
            });
            const flash = new THREE.Mesh(flashGeometry, flashMaterial);
            flash.position.copy(player.position);
            flash.position.y = 2;
            scene.add(flash);

            particles.push({
                mesh: flash,
                life: 0.1,
                maxLife: 0.1
            });
        }

        function jump() {
            if (!gameRunning || gamePaused) return;
            if (player.position.y <= 0.1) {
                playerVelocity.y = 10;
                isJumping = true;
            }
        }

        function setupJoystick() {
            const joystickArea = document.getElementById('joystickArea');
            const joystickKnob = document.getElementById('joystickKnob');
            let joystickCenter = { x: 0, y: 0 };

            joystickArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = joystickArea.getBoundingClientRect();
                joystickCenter = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                joystickData.active = true;
                updateJoystick(touch.clientX, touch.clientY);
            });

            joystickArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                updateJoystick(touch.clientX, touch.clientY);
            });

            joystickArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                joystickData.active = false;
                joystickData.x = 0;
                joystickData.y = 0;
                joystickKnob.style.transform = 'translate(-50%, -50%)';
            });

            // Mouse support
            joystickArea.addEventListener('mousedown', (e) => {
                const rect = joystickArea.getBoundingClientRect();
                joystickCenter = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                joystickData.active = true;
                updateJoystick(e.clientX, e.clientY);
            });

            document.addEventListener('mousemove', (e) => {
                if (joystickData.active) {
                    updateJoystick(e.clientX, e.clientY);
                }
            });

            document.addEventListener('mouseup', () => {
                joystickData.active = false;
                joystickData.x = 0;
                joystickData.y = 0;
                joystickKnob.style.transform = 'translate(-50%, -50%)';
            });

            function updateJoystick(clientX, clientY) {
                const dx = clientX - joystickCenter.x;
                const dy = clientY - joystickCenter.y;
                const maxDist = 50;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > maxDist) {
                    const scale = maxDist / dist;
                    joystickData.x = (dx * scale) / maxDist;
                    joystickData.y = (dy * scale) / maxDist;
                } else {
                    joystickData.x = dx / maxDist;
                    joystickData.y = dy / maxDist;
                }

                joystickKnob.style.transform = `translate(${joystickData.x * 50}px, ${joystickData.y * 50}px)`;
            }
        }

        function onKeyDown(e) {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') {
                jump();
                e.preventDefault();
            }
        }

        function onKeyUp(e) {
            keys[e.key.toLowerCase()] = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ====== GAME LOOP ======
        function animate(time) {
            requestAnimationFrame(animate);

            if (!gameRunning || gamePaused) {
                renderer.render(scene, camera);
                return;
            }

            const delta = (time - lastTime) / 1000;
            lastTime = time;

            // Update player
            updatePlayer(delta);
            updateCamera();
            updateEnemies(delta);
            updateBullets(delta);
            updateParticles(delta);
            updateUI();

            renderer.render(scene, camera);
        }

        function updatePlayer(delta) {
            // Keyboard input
            let moveX = 0;
            let moveZ = 0;

            if (keys['w'] || keys['arrowup']) moveZ -= 1;
            if (keys['s'] || keys['arrowdown']) moveZ += 1;
            if (keys['a'] || keys['arrowleft']) moveX -= 1;
            if (keys['d'] || keys['arrowright']) moveX += 1;

            // Joystick input
            if (joystickData.active) {
                moveX = joystickData.x;
                moveZ = joystickData.y;
            }

            // Normalize
            const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (length > 0) {
                moveX = moveX / length;
                moveZ = moveZ / length;

                // Rotate player
                const angle = Math.atan2(moveX, moveZ);
                player.rotation.y = angle;

                // Move player
                const speed = 15;
                player.position.x += moveX * speed * delta;
                player.position.z += moveZ * speed * delta;
            }

            // Jump physics
            playerVelocity.y -= 20 * delta;
            player.position.y += playerVelocity.y * delta;

            if (player.position.y <= 0) {
                player.position.y = 0;
                playerVelocity.y = 0;
                isJumping = false;
            }

            // Bounds
            player.position.x = Math.max(-250, Math.min(250, player.position.x));
            player.position.z = Math.max(-250, Math.min(250, player.position.z));

            // Collision with trees
            trees.forEach(tree => {
                const dx = player.position.x - tree.position.x;
                const dz = player.position.z - tree.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < 2) {
                    player.position.x = tree.position.x + (dx / dist) * 2;
                    player.position.z = tree.position.z + (dz / dist) * 2;
                }
            });

            // Collision with rocks
            obstacles.forEach(rock => {
                const dx = player.position.x - rock.position.x;
                const dz = player.position.z - rock.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < 2) {
                    player.position.x = rock.position.x + (dx / dist) * 2;
                    player.position.z = rock.position.z + (dz / dist) * 2;
                }
            });
        }

        function updateCamera() {
            // Camera follow player
            const cameraOffset = new THREE.Vector3(0, 20, 15);
            const cameraTarget = player.position.clone().add(cameraOffset);
            camera.position.lerp(cameraTarget, 0.1);
            camera.lookAt(player.position);
        }

        function updateEnemies(delta) {
            enemies.forEach((enemy, index) => {
                // Move towards player
                const direction = new THREE.Vector3()
                    .subVectors(player.position, enemy.mesh.position);
                direction.y = 0;
                const dist = direction.length();

                if (dist > 3) {
                    direction.normalize();
                    enemy.mesh.position.add(direction.multiplyScalar(enemy.speed * delta));
                    enemy.mesh.rotation.y = Math.atan2(direction.x, direction.z);
                }

                // Attack
                if (dist < enemy.attackRange) {
                    enemy.attackCooldown -= delta;
                    if (enemy.attackCooldown <= 0) {
                        health -= 10;
                        enemy.attackCooldown = 2;
                        if (health <= 0) {
                            gameOver();
                        }
                    }
                }

                // Bobbing animation
                enemy.mesh.position.y = Math.sin(time * 3 + index) * 0.2;
            });
        }

        function updateBullets(delta) {
            bullets = bullets.filter(bullet => {
                bullet.life -= delta;
                bullet.mesh.position.add(bullet.velocity.clone().multiplyScalar(delta));

                // Check collision with enemies
                enemies.forEach((enemy, enemyIndex) => {
                    const dist = bullet.mesh.position.distanceTo(enemy.mesh.position);
                    if (dist < 2) {
                        enemy.health -= 50;
                        scene.remove(bullet.mesh);
                        bullet.life = 0;

                        if (enemy.health <= 0) {
                            // Kill enemy
                            scene.remove(enemy.mesh);
                            enemies.splice(enemyIndex, 1);
                            kills++;
                            score += 100;
                            spawnEnemy();
                            createExplosion(enemy.mesh.position);
                        }
                    }
                });

                return bullet.life > 0;
            });

            // Remove dead bullets
            bullets.forEach(bullet => {
                if (bullet.life <= 0) {
                    scene.remove(bullet.mesh);
                }
            });
            bullets = bullets.filter(bullet => bullet.life > 0);
        }

        function createExplosion(position) {
            // Particle explosion
            for (let i = 0; i < 20; i++) {
                const particleGeometry = new THREE.SphereGeometry(0.1, 4, 4);
                const particleMaterial = new THREE.MeshBasicMaterial({ 
                    color: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                    transparent: true
                });
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                particle.position.copy(position);
                scene.add(particle);

                particles.push({
                    mesh: particle,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 20,
                        Math.random() * 10,
                        (Math.random() - 0.5) * 20
                    ),
                    life: 1,
                    maxLife: 1
                });
            }
        }

        function updateParticles(delta) {
            particles = particles.filter(particle => {
                particle.life -= delta;
                
                if (particle.velocity) {
                    particle.mesh.position.add(particle.velocity.clone().multiplyScalar(delta));
                    particle.velocity.y -= 10 * delta;
                }

                const opacity = particle.life / particle.maxLife;
                if (particle.mesh.material) {
                    particle.mesh.material.opacity = opacity;
                }

                if (particle.life <= 0) {
                    scene.remove(particle.mesh);
                    return false;
                }
                return true;
            });
        }

        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('healthDisplay').textContent = Math.max(0, Math.round(health));
            document.getElementById('killDisplay').textContent = kills;
        }

        // ====== GAME CONTROL ======
        function startGame() {
            document.getElementById('gameMenu').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            
            // Reset game
            score = 0;
            kills = 0;
            health = 100;
            player.position.set(0, 0, 0);
            
            // Clear enemies
            enemies.forEach(enemy => scene.remove(enemy.mesh));
            enemies = [];
            
            // Spawn new enemies
            for (let i = 0; i < 5; i++) {
                spawnEnemy();
            }
            
            gameRunning = true;
            gamePaused = false;
            lastTime = performance.now();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = `Điểm: ${score}`;
            document.getElementById('gameOver').style.display = 'flex';
            
            // Update total stats
            document.getElementById('totalKills').textContent = kills;
            document.getElementById('totalScore').textContent = score;
        }

        function restartGame() {
            startGame();
        }

        function backToMenu() {
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('gameMenu').style.display = 'flex';
            gameRunning = false;
        }

        // ====== INIT ======
        createParticles();
    </script>
</body>
</html>
