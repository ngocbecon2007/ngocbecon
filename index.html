<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngọc Becon ♡</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap');

        :root {
            --pink: #ff69b4;
            --deeppink: #ff1493;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe4f3 0%, #ffc2d9 50%, #f8a8ff 100%);
            min-height: 100vh;
            color: #4a2c4a;
            overflow-x: hidden;
            text-align: center;
            position: relative;
            touch-action: manipulation;
        }

        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff8fab, #ff4d94, #ff69b4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            transition: opacity 1s ease;
        }

        .enter-btn {
            padding: 20px 60px;
            font-size: 1.55rem;
            font-weight: 600;
            background: white;
            color: var(--deeppink);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(255, 20, 147, 0.45);
            transition: all 0.4s ease;
        }

        .enter-btn:hover {
            transform: scale(1.08) translateY(-5px);
            box-shadow: 0 18px 40px rgba(255, 20, 147, 0.55);
        }

        /* Main Content */
        #mainContent {
            max-width: 620px;
            margin: 0 auto;
            padding: 40px 20px;
            opacity: 0;
            transition: opacity 1.5s ease;
            display: none;
        }

        .avatar {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            border: 8px solid #fff;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.5);
            object-fit: cover;
            margin: 25px auto;
            transition: transform 0.4s;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            margin-bottom: 8px;
            color: #ff1493;
            text-shadow: 0 5px 15px rgba(255, 20, 147, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .verified {
            background: #20d5ff;
            color: white;
            font-size: 1.1rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px #20d5ff;
            font-weight: bold;
        }

        .subtitle {
            font-size: 1.35rem;
            color: #c05a8a;
            margin-bottom: 35px;
        }

        .bio {
            background: rgba(255, 255, 255, 0.78);
            padding: 28px;
            border-radius: 30px;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.25);
            font-size: 1.15rem;
            line-height: 1.7;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            margin: 35px 0;
        }

        .btn {
            display: inline-block;
            padding: 15px 32px;
            margin: 8px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1.15rem;
        }

        .btn-pink {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
        }

        .btn-pink:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 20, 147, 0.45);
        }

        .btn-outline {
            border: 3px solid #ff69b4;
            color: #ff1493;
        }

        .btn-outline:hover {
            background: #ff69b4;
            color: white;
        }

        /* Bong bóng hồng + trái tim */
        .bubble {
            position: absolute;
            bottom: -60px;
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 35% 35%, #fff, #ff69b4);
            border-radius: 50%;
            opacity: 0.88;
            pointer-events: none;
            box-shadow: 0 0 18px #ff1493;
            animation: floatUp linear forwards;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-130vh) scale(0.5);
                opacity: 0;
            }
        }

        footer {
            margin-top: 60px;
            font-size: 0.95rem;
            color: #c05a8a;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <button class="enter-btn" onclick="enterWebsite()">
                           Ngọc Becon ♡
        </button>
    </div>

    <!-- Main Content -->
    <div class="container" id="mainContent">
        <img src="avatar.jpg" alt="Ngọc Becon" class="avatar">

        <h1>
            Ngọc Becon 
            <span class="verified">✔</span>
        </h1>
        <p class="subtitle">Cosplayer • Content Creator</p>

        <div class="bio">
            Xin chào 💕<br>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/share/1DxsNV1a7k/" target="_blank" class="btn btn-pink">Facebook</a>
            <a href="https://discord.com/users/ngocbecon" target="_blank" class="btn btn-pink">Discord @ngocbecon</a>
            <a href="https://zyo.lol/ngocbecon" target="_blank" class="btn btn-outline">Trang chính</a>
        </div>
    </div>

    <footer id="footer" style="display: none;">
        Made with lots of ♡ by Ngọc Becon
    </footer>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('bgMusic');
        const loadingScreen = document.getElementById('loading');
        const mainContent = document.getElementById('mainContent');
        const footer = document.getElementById('footer');

        function enterWebsite() {
            loadingScreen.style.opacity = '0';
            
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                
                mainContent.style.display = 'block';
                setTimeout(() => {
                    mainContent.style.opacity = '1';
                }, 100);

                footer.style.display = 'block';

                music.play().catch(() => {});

                startBubbles();
            }, 800);
        }

        // Bong bóng hồng + trái tim
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.textContent = '♡';
            
            const size = Math.random() * 38 + 24;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}vw`;
            bubble.style.animationDuration = `${Math.random() * 8 + 7}s`;
            bubble.style.opacity = Math.random() * 0.85 + 0.6;
            
            document.body.appendChild(bubble);
            
            setTimeout(() => bubble.remove(), 16000);
        }

        function startBubbles() {
            setInterval(() => {
                if (Math.random() > 0.28) {
                    createBubble();
                }
            }, 550);
        }
    </script>
</body>
</html>
