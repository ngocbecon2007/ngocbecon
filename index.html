<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ngọc Becon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
html,body{width:100%;height:100%;overflow:hidden}

body{
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle at top,#ff2f92 0%,#8a009f 40%,#120018 85%);
color:#fff;
}

/* 🌌 STAR */
canvas{
position:fixed;
inset:0;
z-index:-2;
}

/* 🎥 INTRO */
#intro{
position:fixed;inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:inherit;
z-index:10;
}

#brand span{
font-size:36px;
font-weight:800;
color:#ff77c8;
text-shadow:0 0 25px #ff2f92;
animation:wave 1.6s infinite ease-in-out;
}
#brand{display:flex;gap:5px;margin-bottom:20px}
#brand span:nth-child(n){animation-delay:calc(var(--i)*0.1s)}

@keyframes wave{
0%,100%{transform:translateY(0);opacity:.5}
50%{transform:translateY(-10px);opacity:1}
}

#percent{
font-size:40px;
font-weight:700;
color:#ff9bd6;
text-shadow:0 0 25px #ff2f92;
}

#bar{
margin-top:16px;
width:180px;height:6px;
background:rgba(255,255,255,.2);
border-radius:99px;
overflow:hidden;
}
#bar span{
display:block;
height:100%;
width:0%;
background:linear-gradient(90deg,#ff2f92,#ff9bd6);
}

/* 💎 CARD */
.card{
display:none;
background:rgba(255,255,255,.12);
backdrop-filter:blur(25px);
padding:36px 26px;
border-radius:30px;
text-align:center;
box-shadow:0 40px 120px rgba(255,0,150,.5);
z-index:5;
max-width:320px;
width:90%;
}

.link{
display:block;
margin:12px 0;
padding:14px;
border-radius:18px;
background:rgba(255,255,255,.15);
color:#fff;
text-decoration:none;
font-weight:600;
transition:.25s;
}
.link:hover{
background:#ff2f92;
box-shadow:0 0 25px #ff2f92;
}
</style>
</head>

<body>

<canvas id="star"></canvas>

<!-- INTRO -->
<div id="intro">
  <div id="brand">
    <span style="--i:1">N</span>
    <span style="--i:2">g</span>
    <span style="--i:3">ọ</span>
    <span style="--i:4">c</span>
    <span style="--i:5"> </span>
    <span style="--i:6">B</span>
    <span style="--i:7">e</span>
    <span style="--i:8">c</span>
    <span style="--i:9">o</span>
    <span style="--i:10">n</span>
  </div>

  <div id="percent">0%</div>
  <div id="bar"><span></span></div>
</div>

<!-- MAIN -->
<div class="card" id="main">
  🎧 <b>Music:</b> music.mp3

  <a class="link" href="https://www.facebook.com/share/18TVL9TCDZ/" target="_blank">
    📘 Facebook
  </a>

  <a class="link" href="https://discord.gg/dv2QAwssr" target="_blank">
    💬 Discord Group
  </a>
</div>

<audio src="music.mp3" autoplay loop></audio>

<script>
/* 🎥 LOADING */
let p=0;
const percent=document.getElementById("percent");
const bar=document.querySelector("#bar span");
const intro=document.getElementById("intro");
const main=document.getElementById("main");

const load=setInterval(()=>{
  p++;
  percent.innerText=p+"%";
  bar.style.width=p+"%";
  if(p>=100){
    clearInterval(load);
    intro.style.opacity=0;
    setTimeout(()=>{
      intro.style.display="none";
      main.style.display="block";
    },600);
  }
},25);

/* 🌌 STAR EFFECT */
const c=document.getElementById("star");
const ctx=c.getContext("2d");
let w,h,stars=[];
function resize(){
  w=c.width=innerWidth;
  h=c.height=innerHeight;
}
window.onresize=resize;resize();

for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*w,
    y:Math.random()*h,
    r:Math.random()*1.5,
    v:Math.random()*0.6+0.2
  });
}

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#fff";
  stars.forEach(s=>{
    s.y+=s.v;
    if(s.y>h){s.y=0;s.x=Math.random()*w}
    ctx.globalAlpha=Math.random();
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
