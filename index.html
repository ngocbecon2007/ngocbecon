<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ngọc Becon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
html,body{width:100%;height:100%;overflow:hidden}

body{
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle at top,#ff2f92 0%,#8a009f 45%,#120018 90%);
color:#fff;
}

/* 🌌 STAR + ❄️ SNOW */
canvas{position:fixed;inset:0;z-index:-3}

/* 🎥 INTRO */
#intro{
position:fixed;inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;
background:inherit;
}

#brand{display:flex;gap:4px;margin-bottom:16px}
#brand span{
font-size:36px;
font-weight:800;
color:#ff77c8;
text-shadow:0 0 30px #ff2f92;
animation:wave 1.6s infinite ease-in-out;
}
#brand span:nth-child(n){animation-delay:calc(var(--i)*0.1s)}

@keyframes wave{
0%,100%{transform:translateY(0);opacity:.6}
50%{transform:translateY(-10px);opacity:1}
}

#percent{
font-size:38px;
font-weight:700;
color:#ff9bd6;
}

#bar{
margin-top:14px;
width:180px;height:6px;
background:rgba(255,255,255,.2);
border-radius:99px;
overflow:hidden;
}
#bar span{
display:block;height:100%;width:0%;
background:linear-gradient(90deg,#ff2f92,#ff9bd6);
}

/* 💎 CARD */
.card{
display:none;
background:rgba(255,255,255,.12);
backdrop-filter:blur(30px);
padding:34px 26px 30px;
border-radius:34px;
text-align:center;
max-width:320px;
width:90%;
z-index:5;
position:relative;
animation:fadeUp .8s ease;
}

/* ✨ NEON BORDER */
.card::before{
content:"";
position:absolute;
inset:-2px;
border-radius:36px;
background:linear-gradient(90deg,#ff2f92,#4fdcff,#ff77ff,#ff2f92);
background-size:300% 300%;
z-index:-1;
animation:neon 5s linear infinite;
filter:blur(6px);
}

@keyframes neon{
0%{background-position:0%}
100%{background-position:300%}
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:none}
}

/* 🖼 AVATAR */
.avatar-wrap{
width:140px;height:140px;
margin:0 auto 12px;
border-radius:50%;
padding:5px;
background:linear-gradient(135deg,#ff2f92,#4fdcff,#ff77ff);
box-shadow:0 0 35px rgba(255,0,150,.9);
}
.avatar{
width:100%;height:100%;
border-radius:50%;
object-fit:cover;
}

/* NAME + CHECK */
.name{
margin-bottom:18px;
font-size:19px;
font-weight:700;
display:flex;
justify-content:center;
align-items:center;
gap:6px;
}
.check{
width:18px;height:18px;
border-radius:50%;
background:#1da1f2;
font-size:12px;
font-weight:900;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 12px #1da1f2;
}

/* 🔘 BUBBLE BUTTON */
.link{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin:12px 0;
padding:15px;
border-radius:999px;
background:rgba(255,255,255,.16);
color:#fff;
text-decoration:none;
font-weight:600;
transition:.25s;
}

.link:hover{
background:#ff2f92;
box-shadow:0 0 30px #ff2f92;
transform:translateY(-2px);
}

.link:active{
animation:shake .25s;
}

@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-3px)}
50%{transform:translateX(3px)}
75%{transform:translateX(-2px)}
100%{transform:translateX(0)}
}

/* 📱 PE (mobile) */
@media (max-width:480px){
.card{padding:28px 22px}
.avatar-wrap{width:130px;height:130px}
.name{font-size:18px}
.link{padding:16px;font-size:15px}
}

/* 🖥 PC */
@media (min-width:900px){
.card{max-width:360px}
.name{font-size:20px}
}
</style>
</head>

<body>

<canvas id="fx"></canvas>

<!-- INTRO -->
<div id="intro">
  <div id="brand">
    <span style="--i:1">N</span><span style="--i:2">g</span><span style="--i:3">ọ</span>
    <span style="--i:4">c</span><span style="--i:5"> </span>
    <span style="--i:6">B</span><span style="--i:7">e</span>
    <span style="--i:8">c</span><span style="--i:9">o</span><span style="--i:10">n</span>
  </div>
  <div id="percent">0%</div>
  <div id="bar"><span></span></div>
</div>

<!-- MAIN -->
<div class="card" id="main">

  <div class="avatar-wrap">
    <img src="avatar.jpg" class="avatar">
  </div>

  <div class="name">
    Ngọc Becon <span class="check">✓</span>
  </div>

  <a class="link" href="https://www.tiktok.com/@ngocbecon" target="_blank">🎵 TikTok</a>
  <a class="link" href="https://www.facebook.com/share/18TVL9TCDZ/" target="_blank">📘 Facebook</a>
  <a class="link" href="https://discord.gg/dv2QAwssr" target="_blank">💬 Discord Group</a>

</div>

<script>
/* LOADING */
let p=0;
const percent=document.getElementById("percent");
const bar=document.querySelector("#bar span");
const intro=document.getElementById("intro");
const main=document.getElementById("main");

const load=setInterval(()=>{
p++;
percent.innerText=p+"%";
bar.style.width=p+"%";
if(p>=100){
clearInterval(load);
intro.style.opacity=0;
setTimeout(()=>{
intro.style.display="none";
main.style.display="block";
},500);
}
},20);

/* ❄️ SNOW */
const c=document.getElementById("fx");
const ctx=c.getContext("2d");
let w,h,particles=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
window.onresize=resize;resize();

for(let i=0;i<160;i++){
particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2,v:Math.random()*0.8+0.3});
}
function draw(){
ctx.clearRect(0,0,w,h);
ctx.fillStyle="#fff";
particles.forEach(p=>{
p.y+=p.v;
if(p.y>h){p.y=0;p.x=Math.random()*w}
ctx.globalAlpha=Math.random();
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
});
requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
