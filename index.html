<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngọc Becon ♡</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Playfair+Display:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a2e;
            color: white;
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* ====== 3D PARTICLES BACKGROUND ====== */
        #particles-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #1a0533, #2d1b69, #4a1942, #1a0533, #2d1b69);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 50% 0%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 100%; }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #ff69b4, #ff1493, transparent);
            opacity: 0.5;
            animation: particleFloat 25s infinite;
            pointer-events: none;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-150px) translateX(80px) rotate(180deg) scale(1.2); }
            50% { transform: translateY(-300px) translateX(-80px) rotate(360deg) scale(0.8); }
            75% { transform: translateY(-150px) translateX(120px) rotate(540deg) scale(1.1); }
        }

        /* ====== LOADING SCREEN 3D ====== */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a0533, #2d1b69, #4a1942);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease;
            overflow: hidden;
        }

        .loading-stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            animation: starTwinkle 2s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
        }

        .logo-3d {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ff6b9d, #ff1493);
            background-size: 300% 300%;
            animation: gradientMove 3s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 30px;
            box-shadow: 0 0 80px rgba(255, 20, 147, 0.6);
            animation: logoEntrance 2s ease-out forwards, gradientMove 3s ease infinite;
            transform-style: preserve-3d;
            opacity: 0;
            position: relative;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes logoEntrance {
            0% { 
                opacity: 0;
                transform: translateZ(-300px) rotateY(-180deg) rotateX(-180deg) scale(0.3);
            }
            40% {
                opacity: 0.5;
                transform: translateZ(100px) rotateY(-90deg) rotateX(-90deg) scale(0.7);
            }
            70% {
                opacity: 0.8;
                transform: translateZ(-50px) rotateY(30deg) rotateX(30deg) scale(0.9);
            }
            100% { 
                opacity: 1;
                transform: translateZ(0) rotateY(0deg) rotateX(0deg) scale(1);
            }
        }

        .logo-rings {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 3px solid rgba(255, 105, 180, 0.3);
            animation: ringExpand 3s ease-out infinite;
        }

        .logo-rings:nth-child(2) {
            animation-delay: 1s;
        }

        @keyframes ringExpand {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .loading-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #ff69b4;
            margin-bottom: 20px;
            animation: titlePulse 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.5);
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(255, 20, 147, 0.5); }
            50% { transform: scale(1.05); text-shadow: 0 0 60px rgba(255, 20, 147, 0.8); }
        }

        .loading-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff69b4, #ff1493);
            border-radius: 10px;
            animation: loadingProgress 2s ease-out forwards;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
        }

        @keyframes loadingProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .enter-btn-3d {
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.5);
            transition: all 0.4s ease;
            animation: btnEntrance 2s ease-out 1s forwards;
            opacity: 0;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .enter-btn-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: btnShine 3s ease-in-out infinite;
        }

        @keyframes btnShine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        @keyframes btnEntrance {
            0% { 
                opacity: 0;
                transform: translateY(80px) translateZ(-200px) rotateX(60deg) scale(0.5);
            }
            100% { 
                opacity: 1;
                transform: translateY(0) translateZ(0) rotateX(0deg) scale(1);
            }
        }

        .enter-btn-3d:hover {
            transform: scale(1.1) translateZ(80px) translateY(-10px);
            box-shadow: 0 25px 70px rgba(255, 20, 147, 0.8);
        }

        /* ====== MAIN CONTENT 3D ====== */
        #mainContent {
            max-width: 800px;
            margin: 0 auto;
            padding: 50px 20px;
            opacity: 0;
            transition: opacity 1.5s ease;
            display: none;
            transform-style: preserve-3d;
        }

        .avatar-container {
            perspective: 800px;
            margin: 40px auto;
            width: 220px;
            height: 220px;
            position: relative;
            animation: avatarContainerFloat 6s ease-in-out infinite;
        }

        @keyframes avatarContainerFloat {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            25% { transform: translateY(-20px) rotateY(10deg); }
            50% { transform: translateY(0) rotateY(0deg); }
            75% { transform: translateY(20px) rotateY(-10deg); }
        }

        .avatar-3d {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 5px solid #ff69b4;
            box-shadow: 0 0 80px rgba(255, 20, 147, 0.6);
            object-fit: cover;
            transform-style: preserve-3d;
            animation: avatarEntrance 2s ease-out forwards;
            opacity: 0;
            cursor: pointer;
            transition: all 0.5s;
            position: relative;
            z-index: 2;
        }

        @keyframes avatarEntrance {
            0% { 
                opacity: 0;
                transform: translateZ(-400px) rotateY(180deg) rotateX(60deg) scale(0.2);
            }
            30% {
                opacity: 0.4;
                transform: translateZ(150px) rotateY(90deg) rotateX(30deg) scale(0.6);
            }
            60% {
                opacity: 0.7;
                transform: translateZ(-50px) rotateY(-30deg) rotateX(-15deg) scale(0.9);
            }
            85% {
                opacity: 0.9;
                transform: translateZ(30px) rotateY(10deg) rotateX(5deg) scale(1.05);
            }
            100% { 
                opacity: 1;
                transform: translateZ(0) rotateY(0deg) rotateX(0deg) scale(1);
            }
        }

        .avatar-3d:hover {
            transform: translateZ(80px) scale(1.15);
            box-shadow: 0 0 120px rgba(255, 20, 147, 0.9);
            border-color: #fff;
        }

        .avatar-glow {
            position: absolute;
            top: -20px;
            left: -20px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.3), transparent);
            animation: glowPulse 3s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .avatar-rings {
            position: absolute;
            top: -15px;
            left: -15px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 3px solid rgba(255, 105, 180, 0.4);
            animation: ringRotate 10s linear infinite;
            z-index: 0;
        }

        @keyframes ringRotate {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(360deg); }
        }

        .avatar-rings::before {
            content: '✨';
            position: absolute;
            top: -15px;
            left: 50%;
            font-size: 20px;
        }

        .name-3d {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            margin: 30px 0;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ff6b9d, #ff1493);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: nameEntrance 2s ease-out 0.5s forwards, gradientMove 3s ease infinite;
            opacity: 0;
            transform-style: preserve-3d;
            text-shadow: none;
            position: relative;
        }

        @keyframes nameEntrance {
            0% { 
                opacity: 0;
                transform: translateZ(-300px) rotateX(90deg) scale(0.5);
                filter: blur(10px);
            }
            50% {
                opacity: 0.5;
                transform: translateZ(100px) rotateX(45deg) scale(0.8);
                filter: blur(5px);
            }
            100% { 
                opacity: 1;
                transform: translateZ(0) rotateX(0deg) scale(1);
                filter: blur(0);
            }
        }

        .verified-3d {
            background: linear-gradient(135deg, #20d5ff, #0099ff);
            color: white;
            font-size: 1.3rem;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px #20d5ff;
            margin-left: 15px;
            animation: verifiedPop 1.5s ease-out 2s forwards;
            opacity: 0;
            transform: scale(0);
            position: relative;
            vertical-align: middle;
        }

        @keyframes verifiedPop {
            0% { opacity: 0; transform: scale(0) rotateY(180deg) translateZ(-100px); }
            50% { opacity: 0.5; transform: scale(1.5) rotateY(90deg) translateZ(50px); }
            75% { opacity: 0.8; transform: scale(0.9) rotateY(-30deg) translateZ(-20px); }
            100% { opacity: 1; transform: scale(1) rotateY(0deg) translateZ(0); }
        }

        .subtitle-3d {
            font-size: 1.5rem;
            color: #ff69b4;
            margin-bottom: 30px;
            animation: subtitleEntrance 2s ease-out 0.8s forwards;
            opacity: 0;
            font-weight: 600;
            letter-spacing: 2px;
        }

        @keyframes subtitleEntrance {
            0% { opacity: 0; transform: translateY(80px) translateZ(-200px) rotateX(45deg); }
            100% { opacity: 1; transform: translateY(0) translateZ(0) rotateX(0deg); }
        }

        .bio-3d {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 25px;
            margin: 30px auto;
            border: 2px solid rgba(255, 105, 180, 0.3);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            font-size: 1.2rem;
            line-height: 1.8;
            animation: bioEntrance 2s ease-out 1.1s forwards;
            opacity: 0;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .bio-3d::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 105, 180, 0.1), transparent);
            animation: bioShine 5s ease-in-out infinite;
        }

        @keyframes bioShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @keyframes bioEntrance {
            0% { 
                opacity: 0;
                transform: translateZ(-300px) rotateX(45deg) rotateY(-45deg) scale(0.5);
            }
            50% {
                opacity: 0.5;
                transform: translateZ(50px) rotateX(20deg) rotateY(-20deg) scale(0.8);
            }
            100% { 
                opacity: 1;
                transform: translateZ(0) rotateX(0deg) rotateY(0deg) scale(1);
            }
        }

        .bio-3d:hover {
            transform: translateZ(50px) scale(1.02);
            box-shadow: 0 35px 100px rgba(255, 20, 147, 0.4);
            border-color: #ff69b4;
        }

        /* ====== SOCIAL LINKS 3D ====== */
        .social-links-3d {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin: 50px 0;
        }

        .btn-3d {
            display: inline-block;
            padding: 18px 40px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.5s ease;
            font-size: 1.2rem;
            opacity: 0;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .btn-3d:nth-child(1) { animation: btnEntrance 2s ease-out 1.4s forwards; }
        .btn-3d:nth-child(2) { animation: btnEntrance 2s ease-out 1.6s forwards; }
        .btn-3d:nth-child(3) { animation: btnEntrance 2s ease-out 1.8s forwards; }
        .btn-3d:nth-child(4) { animation: btnEntrance 2s ease-out 2s forwards; }

        @keyframes btnEntrance {
            0% { 
                opacity: 0;
                transform: translateY(100px) translateZ(-300px) rotateX(90deg) scale(0.3);
            }
            50% {
                opacity: 0.5;
                transform: translateY(-20px) translateZ(50px) rotateX(-30deg) scale(0.8);
            }
            100% { 
                opacity: 1;
                transform: translateY(0) translateZ(0) rotateX(0deg) scale(1);
            }
        }

        .btn-pink-3d {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.5);
        }

        .btn-pink-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: btnShine 3s ease-in-out infinite;
        }

        .btn-pink-3d:hover {
            transform: translateY(-15px) translateZ(100px) scale(1.15);
            box-shadow: 0 30px 80px rgba(255, 20, 147, 0.8);
        }

        .btn-outline-3d {
            border: 3px solid #ff69b4;
            color: #ff69b4;
            background: rgba(255, 105, 180, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn-outline-3d:hover {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            transform: translateY(-15px) translateZ(100px) scale(1.15);
            box-shadow: 0 30px 80px rgba(255, 20, 147, 0.8);
        }

        .btn-tiktok-3d {
            background: linear-gradient(45deg, #25F4EE, #FE2C55);
            color: white;
            box-shadow: 0 15px 40px rgba(254, 44, 85, 0.5);
        }

        .btn-tiktok-3d:hover {
            transform: translateY(-15px) translateZ(100px) scale(1.15);
            box-shadow: 0 30px 80px rgba(254, 44, 85, 0.8);
        }

        /* ====== FLOATING HEARTS ====== */
        .heart-3d {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 100;
            animation: heartRise linear forwards;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
        }

        @keyframes heartRise {
            0% { 
                transform: translateY(100vh) scale(0.3) rotateY(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            50% { 
                transform: translateY(50vh) scale(1) rotateY(180deg);
                opacity: 0.8;
            }
            80% {
                opacity: 0.5;
            }
            100% { 
                transform: translateY(-10vh) scale(1.5) rotateY(360deg);
                opacity: 0;
            }
        }

        /* ====== FOOTER ====== */
        footer {
            margin-top: 60px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            padding: 20px;
            animation: footerEntrance 2s ease-out 2.5s forwards;
            opacity: 0;
            text-align: center;
        }

        @keyframes footerEntrance {
            0% { opacity: 0; transform: translateY(50px) translateZ(-100px); }
            100% { opacity: 1; transform: translateY(0) translateZ(0); }
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 768px) {
            .name-3d { font-size: 2.8rem; }
            .avatar-container { width: 170px; height: 170px; }
            .avatar-3d { width: 170px; height: 170px; }
            .avatar-glow { width: 210px; height: 210px; }
            .avatar-rings { width: 200px; height: 200px; }
            .btn-3d { padding: 14px 28px; font-size: 1rem; }
            .loading-title { font-size: 2rem; }
            .loading-bar { width: 250px; }
        }
    </style>
</head>
<body>

    <!-- 3D Particles Background -->
    <div id="particles-3d"></div>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="loading-stars" id="loadingStars"></div>
        <div class="logo-3d">🌸</div>
        <div class="logo-rings"></div>
        <div class="logo-rings"></div>
        <h2 class="loading-title">✨ Ngọc Becon ✨</h2>
        <div class="loading-bar">
            <div class="loading-bar-fill"></div>
        </div>
        <button class="enter-btn-3d" onclick="enterWebsite()">
            💖 Bấm để vào 💖
        </button>
    </div>

    <!-- Main Content -->
    <div id="mainContent">
        <div class="avatar-container">
            <div class="avatar-glow"></div>
            <div class="avatar-rings"></div>
            <img src="avatar.jpg" alt="Ngọc Becon" class="avatar-3d" onclick="spinAvatar()">
        </div>

        <h1 class="name-3d">
            Ngọc Becon <span class="verified-3d">✔</span>
        </h1>
        <p class="subtitle-3d">✨ Cosplayer • Content Creator ✨</p>

        <div class="bio-3d">
            💕 Xin chào mọi người! 💕<br>
            Chào mừng đến với thế giới của Ngọc Becon ✨<br>
            Nơi có những điều tuyệt vời nhất đang chờ đón! 🌸
        </div>

        <div class="social-links-3d">
            <a href="https://www.facebook.com/share/1JB2aqRUcf/" target="_blank" class="btn-3d btn-pink-3d">📘 Facebook</a>
            <a href="https://discord.gg/ARPDvS2sW" target="_blank" class="btn-3d btn-outline-3d">💬 Discord</a>
            <a href="https://www.tiktok.com/@ngoc.becon?_r=1&_t=ZS-9A1THLSDFxK" target="_blank" class="btn-3d btn-tiktok-3d">🎵 TikTok</a>
            <a href="https://zyo.lol/ngocbecon" target="_blank" class="btn-3d btn-outline-3d">🔗 Trang chính</a>
        </div>
    </div>

    <footer id="footer" style="display: none;">
        Made with ♡ by Ngọc Becon | 3D Ultimate Experience ✨
    </footer>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('bgMusic');
        const loadingScreen = document.getElementById('loading');
        const mainContent = document.getElementById('mainContent');
        const footer = document.getElementById('footer');

        // Tạo particles 3D
        function createParticles() {
            const container = document.getElementById('particles-3d');
            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 25 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 25 + 's';
                particle.style.animationDuration = Math.random() * 20 + 15 + 's';
                container.appendChild(particle);
            }
        }

        // Tạo sao loading
        function createLoadingStars() {
            const container = document.getElementById('loadingStars');
            const emojis = ['⭐', '✨', '💖', '🌸', '💫', '🌟'];
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.fontSize = Math.random() * 30 + 15 + 'px';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }

        // Tạo trái tim bay
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-3d';
            heart.textContent = ['💖', '💗', '💓', '💕', '🌸', '✨', '💘', '💝'][Math.floor(Math.random() * 8)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 40 + 20 + 'px';
            heart.style.animationDuration = Math.random() * 10 + 8 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 20000);
        }

        // Spin avatar khi click
        function spinAvatar() {
            const avatar = document.querySelector('.avatar-3d');
            avatar.style.transition = 'transform 1.5s';
            avatar.style.transform = 'rotateY(720deg) translateZ(100px) scale(1.2)';
            setTimeout(() => {
                avatar.style.transform = '';
            }, 1500);
        }

        function enterWebsite() {
            loadingScreen.style.opacity = '0';
            
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                
                mainContent.style.display = 'block';
                setTimeout(() => {
                    mainContent.style.opacity = '1';
                }, 100);

                footer.style.display = 'block';

                music.play().catch(() => {});

                // Tạo trái tim liên tục
                setInterval(() => {
                    if (Math.random() > 0.2) {
                        createHeart();
                    }
                }, 300);
            }, 800);
        }

        // Khởi tạo
        createParticles();
        createLoadingStars();
    </script>
</body>
</html>
