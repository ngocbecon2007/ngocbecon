<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ADMIN – Ngọc Becon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--pink:#ff4fa3}
*{box-sizing:border-box;font-family:Segoe UI,Arial}

/* ===== BASE ===== */
body{
  margin:0;
  background:radial-gradient(circle,#3a0045,#0b0010);
  color:#fff;
}

/* ===== HEADER ===== */
header{
  background:linear-gradient(90deg,#ff4fa3,#ff77b7);
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

/* ===== CARD ===== */
.card{
  background:#16001d;
  padding:20px;
  border-radius:20px;
  margin:20px;
}

/* ===== TABLE ===== */
.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  min-width:520px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #333;
  font-size:14px;
}

/* ===== BUTTON ===== */
button{
  padding:6px 12px;
  border:none;
  border-radius:10px;
  background:var(--pink);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
.danger{background:#ff3b3b}
.small{font-size:12px;color:#ffb6d9}

/* ================== MOBILE / PE ================== */
@media (max-width:768px){
  header{font-size:18px;padding:14px}
  .card{margin:12px;padding:16px}
  button{
    padding:10px 14px;
    font-size:14px;
  }
  table{min-width:600px}
}

/* ================== PC ================== */
@media (min-width:1024px){
  body{
    background:
      radial-gradient(circle at top,#4a005a,#0b0010),
      linear-gradient(180deg,#120018,#000);
  }
}
</style>
</head>

<body>

<header>🔐 ADMIN NGỌC BECON</header>

<!-- USERS -->
<div class="card">
<h2>👤 Người dùng</h2>
<div class="table-wrap">
<table>
<tr><th>User</th><th>Số dư</th><th>Hành động</th></tr>
<tbody id="userList"></tbody>
</table>
</div>
</div>

<!-- TOPUP -->
<div class="card">
<h2>💳 Nạp tiền chờ duyệt</h2>
<div class="table-wrap">
<table>
<tr>
<th>User</th><th>Loại</th><th>Số tiền</th><th>Chi tiết</th><th>Hành động</th>
</tr>
<tbody id="topupList"></tbody>
</table>
</div>
</div>

<!-- ORDERS -->
<div class="card">
<h2>📦 Đơn cày thuê</h2>
<div class="table-wrap">
<table>
<tr>
<th>User</th><th>Game</th><th>Gói</th><th>Giá</th><th>Hành động</th>
</tr>
<tbody id="orderList"></tbody>
</table>
</div>
</div>

<script>
let DB = JSON.parse(localStorage.getItem("SHOP_DB")) || {
  users:{}, orders:[], topups:[]
}

function save(){
  localStorage.setItem("SHOP_DB",JSON.stringify(DB))
  render()
}

/* ========== USERS ========== */
function renderUsers(){
  userList.innerHTML=""
  Object.keys(DB.users).forEach(u=>{
    let tr=document.createElement("tr")
    tr.innerHTML=`
      <td>${u}</td>
      <td>${DB.users[u].money}đ</td>
      <td>
        <button onclick="addMoney('${u}',10000)">+10k</button>
        <button class="danger" onclick="addMoney('${u}',-10000)">-10k</button>
      </td>`
    userList.appendChild(tr)
  })
}

function addMoney(user,amount){
  DB.users[user].money+=amount
  notify(user,`💰 ${amount>0?'+':''}${amount}đ`)
  save()
}

/* ========== TOPUP ========== */
function renderTopups(){
  topupList.innerHTML=""
  DB.topups.filter(t=>t.status==="pending").forEach(t=>{
    let detail="Không có"
    if(t.type==="CARD" && t.detail){
      detail=`
      <div class="small">
        📶 ${t.detail.telco}<br>
        Seri: ${t.detail.seri}<br>
        Mã: ${t.detail.code}
      </div>`
    }
    if(t.type==="MOMO"){
      detail=`<div class="small">💗 MoMo</div>`
    }
    let tr=document.createElement("tr")
    tr.innerHTML=`
      <td>${t.user}</td>
      <td>${t.type}</td>
      <td>${t.amount}</td>
      <td>${detail}</td>
      <td>
        <button onclick="approveTopup(${t.id})">Duyệt</button>
        <button class="danger" onclick="rejectTopup(${t.id})">Từ chối</button>
      </td>`
    topupList.appendChild(tr)
  })
}

function approveTopup(id){
  let t=DB.topups.find(x=>x.id===id)
  if(!t)return
  DB.users[t.user].money+=t.amount
  t.status="done"
  save()
}

function rejectTopup(id){
  let t=DB.topups.find(x=>x.id===id)
  if(!t)return
  t.status="reject"
  save()
}

/* ========== ORDERS ========== */
function renderOrders(){
  orderList.innerHTML=""
  DB.orders.filter(o=>o.status==="pending").forEach(o=>{
    let tr=document.createElement("tr")
    tr.innerHTML=`
      <td>${o.user}</td>
      <td>${o.game}</td>
      <td>${o.pack}</td>
      <td>${o.price}</td>
      <td>
        <button onclick="approveOrder(${o.id})">Hoàn thành</button>
        <button class="danger" onclick="rejectOrder(${o.id})">Hủy</button>
      </td>`
    orderList.appendChild(tr)
  })
}

function approveOrder(id){
  let o=DB.orders.find(x=>x.id===id)
  if(!o)return
  o.status="done"
  save()
}

function rejectOrder(id){
  let o=DB.orders.find(x=>x.id===id)
  if(!o)return
  o.status="reject"
  save()
}

/* ========== NOTIFY ========== */
function notify(user,text){
  if(!DB.users[user].notifications)
    DB.users[user].notifications=[]
  DB.users[user].notifications.push({
    text,
    time:new Date().toLocaleString()
  })
}

/* ========== RENDER ========== */
function render(){
  renderUsers()
  renderTopups()
  renderOrders()
}
render()
</script>

</body>
</html>
