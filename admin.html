<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ADMIN – Ngọc Becon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--pink:#ff4fa3}
*{box-sizing:border-box;font-family:Segoe UI,Arial}

body{
  margin:0;
  background:radial-gradient(circle,#3a0045,#0b0010);
  color:#fff
}

header{
  background:linear-gradient(90deg,#ff4fa3,#ff77b7);
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:bold
}

.card{
  background:#16001d;
  padding:20px;
  border-radius:20px;
  margin:20px
}

h2{margin:0 0 10px}

table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333;font-size:14px}

button{
  padding:6px 12px;
  border:none;
  border-radius:10px;
  background:var(--pink);
  color:#fff;
  font-weight:bold;
  cursor:pointer
}
.danger{background:#ff3b3b}

.small{font-size:12px;color:#ffb6d9}

input,select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  border:none;
  font-size:14px
}
</style>
</head>

<body>

<header>🔐 ADMIN NGỌC BECON</header>

<!-- ===== FORM NẠP TIỀN (PC + PE) ===== -->
<div class="card">
<h2>💳 Nạp tiền</h2>

<select id="topupType">
  <option value="CARD">📶 Thẻ cào</option>
  <option value="MOMO">💗 MoMo</option>
</select>

<input id="topupUser" placeholder="Tên tài khoản">
<input id="topupAmount" type="number" placeholder="Số tiền">

<div id="cardBox">
  <input id="cardTelco" placeholder="Nhà mạng (Viettel / Vina / Mobi)">
  <input id="cardSeri" placeholder="Seri thẻ">
  <input id="cardCode" placeholder="Mã thẻ">
</div>

<button onclick="submitTopup()">Gửi nạp tiền</button>
<div class="small" id="topupMsg"></div>
</div>

<!-- ===== USERS ===== -->
<div class="card">
<h2>👤 Người dùng</h2>
<table>
<tr><th>User</th><th>Số dư</th><th>Hành động</th></tr>
<tbody id="userList"></tbody>
</table>
</div>

<!-- ===== TOPUP ADMIN ===== -->
<div class="card">
<h2>💳 Nạp tiền chờ duyệt</h2>
<table>
<tr>
<th>User</th><th>Loại</th><th>Số tiền</th><th>Chi tiết</th><th>Hành động</th>
</tr>
<tbody id="topupList"></tbody>
</table>
</div>

<!-- ===== ORDERS (để sẵn) ===== -->
<div class="card">
<h2>📦 Đơn cày thuê</h2>
<table>
<tr><th>User</th><th>Game</th><th>Gói</th><th>Giá</th><th>Hành động</th></tr>
<tbody id="orderList"></tbody>
</table>
</div>

<script>
/* ===== DB ===== */
let DB = JSON.parse(localStorage.getItem("SHOP_DB")) || {
  users:{},
  topups:[],
  orders:[]
}

function save(){
  localStorage.setItem("SHOP_DB",JSON.stringify(DB))
  render()
}

/* ===== FORM TOPUP ===== */
topupType.onchange=()=>{
  cardBox.style.display = topupType.value==="CARD" ? "block" : "none"
}
topupType.onchange()

function submitTopup(){
  let user=topupUser.value.trim()
  let amount=parseInt(topupAmount.value)

  if(!user||!amount){
    topupMsg.innerText="❌ Thiếu user hoặc số tiền"
    return
  }

  if(!DB.users[user])
    DB.users[user]={money:0,notifications:[]}

  let t={
    id:Date.now(),
    user,
    amount,
    type:topupType.value,
    status:"pending",
    time:new Date().toLocaleString()
  }

  if(topupType.value==="CARD"){
    if(!cardTelco.value||!cardSeri.value||!cardCode.value){
      topupMsg.innerText="❌ Thiếu thông tin thẻ"
      return
    }
    t.detail={
      telco:cardTelco.value,
      seri:cardSeri.value,
      code:cardCode.value
    }
  }

  DB.topups.push(t)
  save()
  topupMsg.innerText="✅ Đã gửi nạp tiền – chờ admin duyệt"
}

/* ===== USERS ===== */
function renderUsers(){
  userList.innerHTML=""
  for(let u in DB.users){
    userList.innerHTML+=`
    <tr>
      <td>${u}</td>
      <td>${DB.users[u].money}đ</td>
      <td>
        <button onclick="addMoney('${u}',10000)">+10k</button>
        <button class="danger" onclick="addMoney('${u}',-10000)">-10k</button>
      </td>
    </tr>`
  }
}

function addMoney(u,a){
  DB.users[u].money+=a
  save()
}

/* ===== TOPUP ADMIN ===== */
function renderTopups(){
  topupList.innerHTML=""
  DB.topups.filter(t=>t.status==="pending").forEach(t=>{
    let detail=`<div class="small">Không có</div>`

    if(t.type==="CARD" && t.detail){
      detail=`
      <div class="small">
        📶 ${t.detail.telco}<br>
        🔢 Seri: ${t.detail.seri}<br>
        🔐 Mã: ${t.detail.code}
      </div>`
    }

    if(t.type==="MOMO"){
      detail=`<div class="small">💗 MoMo chuyển khoản</div>`
    }

    topupList.innerHTML+=`
    <tr>
      <td>${t.user}</td>
      <td>${t.type}</td>
      <td>${t.amount}đ</td>
      <td>${detail}</td>
      <td>
        <button onclick="approveTopup(${t.id})">Duyệt</button>
        <button class="danger" onclick="rejectTopup(${t.id})">Từ chối</button>
      </td>
    </tr>`
  })
}

function approveTopup(id){
  let t=DB.topups.find(x=>x.id===id)
  if(!t)return
  DB.users[t.user].money+=t.amount
  t.status="done"
  save()
}

function rejectTopup(id){
  let t=DB.topups.find(x=>x.id===id)
  if(!t)return
  t.status="reject"
  save()
}

/* ===== ORDERS (để sẵn) ===== */
function renderOrders(){
  orderList.innerHTML=""
}

/* ===== RENDER ===== */
function render(){
  renderUsers()
  renderTopups()
  renderOrders()
}
render()
</script>

</body>
</html>
