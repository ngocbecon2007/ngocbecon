<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ngọc Becon Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--pink:#ff4fa3}
*{box-sizing:border-box;font-family:Segoe UI,Arial}
body{margin:0;background:radial-gradient(circle,#3a0045,#0b0010);color:#fff}
.hidden{display:none}
button{cursor:pointer}

/* AUTH */
.auth{
max-width:360px;margin:100px auto;
background:#16001d;padding:24px;
border-radius:20px;text-align:center
}
.auth input,.auth button{
width:100%;padding:14px;margin-top:12px;
border-radius:14px;border:none
}
.auth button{background:linear-gradient(90deg,#ff4fa3,#ff77b7);color:#fff;font-weight:bold}

/* PC MENU */
.pc-menu{
display:flex;justify-content:space-between;align-items:center;
padding:12px 20px;
background:linear-gradient(90deg,#ff4fa3,#ff77b7);
position:sticky;top:0;z-index:20
}
.pc-nav{display:flex;gap:18px}
.pc-nav a{color:#000;font-weight:600;cursor:pointer}
.nav-item{position:relative}
.dropdown{
position:absolute;top:120%;left:0;
background:#fff;color:#000;
border-radius:14px;min-width:180px;
opacity:0;transform:translateY(10px);
pointer-events:none;transition:.25s
}
.dropdown a{display:block;padding:10px 14px;color:#000}
.dropdown a:hover{background:#ffe1ef;color:#ff4fa3}
.nav-item:hover .dropdown{opacity:1;transform:translateY(0);pointer-events:auto}

/* MOBILE */
header{display:none;background:linear-gradient(90deg,#ff4fa3,#ff77b7);padding:12px}
.menu-btn{font-size:22px}
#sideMenu{
position:fixed;left:0;top:0;width:260px;height:100%;
background:#16001d;padding:20px;z-index:30
}
#sideMenu button{
width:100%;margin:8px 0;padding:12px;
border:none;border-radius:14px;
background:#ff4fa3;color:#fff;font-weight:bold
}

/* CONTENT */
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#16001d;padding:20px;border-radius:20px;margin-bottom:20px}
select,input{width:100%;padding:10px;border-radius:10px;border:none;margin:6px 0}

/* TABLE */
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #333}

/* CHAT */
#chatBtn{
position:fixed;right:16px;bottom:16px;
background:#ff4fa3;padding:14px 18px;
border-radius:999px;z-index:40
}
#chatBox{
position:fixed;right:10px;bottom:70px;
width:230px;height:300px;
background:#0f0014;border-radius:16px;
display:none;flex-direction:column
}

@media(max-width:768px){
.pc-menu{display:none}
header{display:flex;justify-content:space-between}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="auth">
  <h2>🐰 Ngọc Becon Shop</h2>

  <input id="user" placeholder="👤 Tài khoản">
  <input id="pass" type="password" placeholder="🔑 Mật khẩu">

  <button onclick="login()">🔐 Đăng nhập</button>

  <hr style="margin:16px 0;border:1px solid #333">

  <p>
    Chưa có tài khoản?
    <span style="color:#ff77b7;cursor:pointer" onclick="showRegister()">Đăng ký ngay</span>
  </p>
</div>

<!-- REGISTER -->
<div id="registerBox" class="auth hidden">
  <h2>🐰 Ngọc Becon Shop</h2>

  <input id="regUser" placeholder="👤 Tài khoản mới">
  <input id="regPass" type="password" placeholder="🔑 Mật khẩu mới">

  <button onclick="register()">📝 Đăng ký</button>

  <hr style="margin:16px 0;border:1px solid #333">

  <p>
    Đã có tài khoản?
    <span style="color:#ff77b7;cursor:pointer" onclick="showLogin()">Đăng nhập</span>
  </p>
</div>
<!-- PC MENU -->
<div class="pc-menu hidden" id="pcMenu">
<b>Ngọc Becon</b>
<div class="pc-nav">
<a onclick="showPage('nap')">Nạp thẻ</a>
<a onclick="showPage('napmomo')">MoMo</a>
<div class="nav-item">
<a>Dịch vụ ▾</a>
<div class="dropdown">
<a onclick="showPage('blox')">Blox Fruit</a>
<a onclick="showPage('ff')">Free Fire</a>
<a onclick="showPage('lq')">Liên Quân</a>
</div>
</div>
<a onclick="showPage('historyOrder')">Lịch sử</a>
</div>
<div>💰 <span id="moneyPC">0</span>đ</div>
</div>

<!-- MOBILE -->
<header id="header" class="hidden">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<b>💰 <span id="money">0</span>đ</b>
</header>

<div id="sideMenu" class="hidden">
<button onclick="showPage('nap')">💳 Nạp thẻ</button>
<button onclick="showPage('napmomo')">💗 MoMo</button>
<button onclick="showPage('blox')">🍏 Blox</button>
<button onclick="showPage('ff')">🔥 Free Fire</button>
<button onclick="showPage('lq')">⚔️ Liên Quân</button>
<button onclick="showPage('historyOrder')">📦 Lịch sử</button>
<button onclick="logout()">🚪 Đăng xuất</button>
</div>

<div class="container hidden" id="shop">

<elect>
<button onclick="order('Free Fire',ffPack)">ĐẶT ĐƠN</button>
</div>

<!-- LIÊN QUÂN -->
<div id="lq" class="card hidden">
<h3>⚔️ Liên Quân</h3>
<select id="lqPack">
<option value="250000">Đồng → BK5 (250k)</option>
<option value="250000">BK5 → KC5 (250k)</option>
<option value="300000">KC5 → TA5 (300k)</option>
<option value="350000">TA5 → CT1⭐ (350k)</option>
</select>
<button onclick="order('Liên Quân',lqPack)">ĐẶT ĐƠN</button>
</div>

<div id="historyTopup" class="card hidden">
<h3>📜 Lịch sử nạp</h3>
<table id="topupTable"></table>
</div>

<div id="historyOrder" class="card hidden">
<h3>📦 Lịch sử đơn</h3>
<table id="orderTable"></table>
</div>

</div>

<!-- CHAT -->
<div id="chatBtn" onclick="toggleChat()">🐰 CSKH</div>
<div id="chatBox">
<div class="chat-header">
CSKH Ngọc Becon
<span style="cursor:pointer" onclick="toggleChat()">✖</span>
</div>
<div id="chatContent">
💬 Facebook hỗ trợ:<br>
<a href="https://www.facebook.com/share/1Ga1MzY9Vs/" target="_blank" style="color:#ff77b7">👉 Ngọc Becon</a>
</div>
<div class="chat-input">
<input id="chatMsg" placeholder="Nhắn tin">
<button onclick="sendText()">➤</button>
</div>

<script>
let DB=JSON.parse(localStorage.getItem("SHOP_DB"))||{users:{},orders:[],money:{}}
let cur=null
const save=()=>localStorage.setItem("SHOP_DB",JSON.stringify(DB))

function showRegister(){loginBox.classList.add("hidden");registerBox.classList.remove("hidden")}
function showLogin(){registerBox.classList.add("hidden");loginBox.classList.remove("hidden")}

function login(){
if(!DB.users[user.value]||DB.users[user.value]!==pass.value) return alert("Sai")
cur=user.value
loginBox.classList.add("hidden")
registerBox.classList.add("hidden")
pcMenu.classList.remove("hidden")
header.classList.remove("hidden")
shop.classList.remove("hidden")
DB.money[cur]=DB.money[cur]||0
money.innerText=moneyPC.innerText=DB.money[cur]
}

function register(){
if(DB.users[regUser.value])return alert("Tồn tại")
DB.users[regUser.value]=regPass.value
DB.money[regUser.value]=0
save();alert("OK");showLogin()
}

function toggleMenu(){sideMenu.classList.toggle("hidden")}
function logout(){location.reload()}

function showPage(id){
document.querySelectorAll(".card").forEach(c=>c.classList.add("hidden"))
document.getElementById(id).classList.remove("hidden")
sideMenu.classList.add("hidden")
if(id==="historyOrder")loadOrder()
}

function napCard(){
DB.money[cur]+=+amount.value
save();money.innerText=moneyPC.innerText=DB.money[cur]
alert("Đã nạp")
}
function napMoMo(){
DB.money[cur]+=+momoAmount.value
save();money.innerText=moneyPC.innerText=DB.money[cur]
alert("OK")
}
function order(game,sel){
DB.orders.push({user:cur,game,pack:sel.options[sel.selectedIndex].text})
save();alert("Đã gửi đơn")
}
function loadOrder(){
orderTable.innerHTML="<tr><th>Game</th><th>Gói</th></tr>"
DB.orders.filter(o=>o.user===cur).forEach(o=>{
orderTable.innerHTML+=`<tr><td>${o.game}</td><td>${o.pack}</td></tr>`
})
}
<script>

</body>
</html>
