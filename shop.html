<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ngọc Becon Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ===== NỀN ANIMATION ===== */
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(270deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
  background-size: 800% 800%;
  animation: gradientBG 15s ease infinite;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.hidden {
  display: none;
}

/* ===== NÚT CSKH ===== */
#chatBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff5ca8;
  color: #fff;
  padding: 12px 16px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  z-index: 9999;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}

/* ===== KHUNG CHAT ===== */
#chatBox {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 280px;
  background: #fff;
  border-radius: 12px;
  z-index: 9999;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
  overflow: hidden;
}

.chat-header {
  background: #ff5ca8;
  color: #fff;
  padding: 10px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

#chatContent {
  padding: 10px;
  height: 200px;
  overflow-y: auto;
}

.msg {
  margin-bottom: 6px;
}

.bubble {
  background: #f1f1f1;
  padding: 8px 12px;
  border-radius: 12px;
  display: inline-block;
  max-width: 80%;
}

.msg.user {
  text-align: right;
}

.msg.user .bubble {
  background: #ffb3d9;
}

.chat-input {
  display: flex;
  border-top: 1px solid #ddd;
}

.chat-input input {
  flex: 1;
  border: none;
  padding: 10px;
  outline: none;
}

.chat-input button {
  border: none;
  background: #ff5ca8;
  color: #fff;
  padding: 0 14px;
  cursor: pointer;
}
</style>
</head>

<body>

<audio src="music.mp3" autoplay loop></audio>

<!-- AUTH -->
<div id="auth" class="auth">
<h2>🐰 Ngọc Becon Shop</h2>
<input id="user" placeholder="Tài khoản">
<input id="pass" type="password" placeholder="Mật khẩu">
<button onclick="login()">🔐 Đăng nhập</button>
<hr style="margin:16px 0;border:1px solid #333">
<input id="regUser" placeholder="Tài khoản mới">
<input id="regPass" type="password" placeholder="Mật khẩu mới">
<button onclick="register()">📝 Đăng ký</button>
</div>

<header id="header" class="hidden">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<b>Số dư: <span id="money">0đ</span></b>
</header>

<div id="sideMenu" class="hidden">
<button onclick="showPage('nap')">💳 Nạp thẻ</button>
<button onclick="showPage('napmomo')">💗 Nạp MoMo</button>
<button onclick="showPage('blox')">🍏 Blox Fruit</button>
<button onclick="showPage('ff')">🔥 Free Fire</button>
<button onclick="showPage('lq')">⚔️ Liên Quân</button>
<button onclick="showPage('historyTopup')">📜 Lịch sử nạp</button>
<button onclick="showPage('historyOrder')">📦 Lịch sử đơn</button>
<button onclick="toggleMenu()">❌ Đóng</button>
</div>

<div class="container hidden" id="shop">

<!-- NẠP THẺ -->
<div id="nap" class="card hidden">
<h3>💳 Nạp thẻ cào </h3>
<select id="telco">
<option>Viettel</option>
<option>MobiFone</option>
<option>VinaPhone</option>
</select>
<select id="amount">
<option value="10000">10.000</option>
<option value="20000">20.000</option>
<option value="50000">50.000</option>
<option value="100000">100.000</option>
<option value="200000">200.000</option>
<option value="500000">500.000</option>
<option value="1000000">1.000.000</option>
</select>
<input id="seri" placeholder="Số seri">
<input id="code" placeholder="Mã thẻ">
<button onclick="napCard()">NẠP NGAY</button>
</div>

<!-- MOMO -->
<div id="napmomo" class="card hidden">
<h3>💗 Nạp MoMo</h3>
<img src="momo.jpg" style="width:100%;border-radius:16px">
<input value="MOMO_NGOCBECON" readonly>
<input id="momoAmount" placeholder="Nhập số tiền">
<button onclick="napMoMo()">XÁC NHẬN ĐÃ CHUYỂN</button>
</div>

<!-- BLOX -->
<div id="blox" class="card hidden">
<h3>🍏 Blox Fruit</h3>
<select id="bloxPack">
<option value="10000">Level 1–2800 (30k)</option>
<option value="10000">yoru 1-3 (40k)</option>
<option value="10000">Mastery 1–300 (10k)</option>
<option value="20000">Haki 7 màu (20k)</option>
<option value="40000">Gear V4 Full (60k)</option>
</select>
<button onclick="order('Blox Fruit',bloxPack)">ĐẶT ĐƠN</button>
</div>

<!-- FREE FIRE -->
<div id="ff" class="card hidden">
<h3>🔥 Free Fire</h3>
<select id="ffPack">
<option value="40000">Đồng → Huyền Thoại (40k)</option>
<option value="60000">Huyền Thoại → Cao Thủ (60k)</option>
<option value="100000">Cao Thủ 100⭐ (100k)</option>
</select>
<button onclick="order('Free Fire',ffPack)">ĐẶT ĐƠN</button>
</div>

<!-- LIÊN QUÂN -->
<div id="lq" class="card hidden">
<h3>⚔️ Liên Quân</h3>
<select id="lqPack">
<option value="250000">Đồng → BK5 (250k)</option>
<option value="250000">BK5 → KC5 (250k)</option>
<option value="300000">KC5 → TA5 (300k)</option>
<option value="350000">TA5 → CT1⭐ (350k)</option>
</select>
<button onclick="order('Liên Quân',lqPack)">ĐẶT ĐƠN</button>
</div>

<!-- LỊCH SỬ -->
<div id="historyTopup" class="card hidden">
<h3>📜 Lịch sử nạp</h3>
<table id="topupTable"></table>
</div>

<div id="historyOrder" class="card hidden">
<h3>📦 Lịch sử đơn</h3>
<table id="orderTable"></table>
</div>

</div>

<!-- CHAT -->
<div id="chatBtn" onclick="toggleChat()">🐰 CSKH</div>
<div id="chatBox" class="hidden">
<div class="chat-header">CSKH Ngọc Becon</div>
<div id="chatContent">
<div class="msg">
<div class="bubble">
💬 Facebook hỗ trợ:<br>
<a href="https://www.facebook.com/share/1Ga1MzY9Vs/" target="_blank" style="color:#ff77b7">👉 Ngọc Becon</a>
</div>
</div>
</div>
<div class="chat-input">
<input id="chatMsg" placeholder="Nhắn tin">
<button onclick="sendText()">➤</button>
</div>
</div>

<script>
let DB = JSON.parse(localStorage.getItem("SHOP_DB")) || {users:{},orders:[],topups:[]}
let cur = null
function save(){ localStorage.setItem("SHOP_DB", JSON.stringify(DB)) }

/* ===== LOGIN ===== */
function login(){
  if(!DB.users[user.value] || DB.users[user.value].pass !== pass.value)
    return alert("Sai tài khoản hoặc mật khẩu")
  cur = user.value
  auth.classList.add("hidden")
  header.classList.remove("hidden")
  shop.classList.remove("hidden")
  money.innerText = DB.users[cur].money + "đ"
}

function register(){
  if(DB.users[regUser.value]) return alert("Tài khoản đã tồn tại")
  DB.users[regUser.value] = {pass:regPass.value, money:0}
  save()
  alert("Đăng ký thành công")
}

/* ===== MENU ===== */
function toggleMenu(){ sideMenu.classList.toggle("hidden") }
function showPage(id){
  document.querySelectorAll(".card").forEach(c=>c.classList.add("hidden"))
  document.getElementById(id).classList.remove("hidden")
  sideMenu.classList.add("hidden")
  if(id==="historyTopup") loadTopup()
  if(id==="historyOrder") loadOrder()
}

/* ===== CHAT CSKH ===== */
function toggleChat(){
  document.getElementById("chatBox").classList.toggle("hidden")
}

function sendText(){
  const chatMsg = document.getElementById("chatMsg")
  const chatContent = document.getElementById("chatContent")
  if(!chatMsg.value) return

  chatContent.innerHTML += `
    <div class="msg user">
      <div class="bubble">${chatMsg.value}</div>
    </div>`
  chatMsg.value = ""
  chatContent.scrollTop = chatContent.scrollHeight
}

/* ===== ORDER ===== */
function order(game,sel){
  DB.orders.push({
    id:Date.now(),
    user:cur,
    game,
    pack:sel.options[sel.selectedIndex].text,
    price:+sel.value,
    status:"pending",
    time:new Date().toLocaleString()
  })
  save()
  alert("Đã gửi đơn sang CSKH")
}

/* ===== NẠP ===== */
function napCard(){
  const telco = telco.value
  const amount = Number(amount.value)
  if(!seri.value || !code.value) return alert("Nhập đủ thông tin")
  DB.topups.push({
    id:Date.now(),
    user:cur,
    type:"CARD",
    amount,
    status:"pending",
    detail:{telco,seri:seri.value,code:code.value},
    time:new Date().toLocaleString()
  })
  save()
  seri.value = code.value = ""
  alert("Đã gửi thẻ")
}

function napMoMo(){
  DB.topups.push({
    id:Date.now(),
    user:cur,
    type:"MOMO",
    amount:+momoAmount.value,
    status:"pending",
    time:new Date().toLocaleString()
  })
  save()
  alert("Đã gửi MoMo")
}

/* ===== LOAD ===== */
function loadTopup(){
  topupTable.innerHTML="<tr><th>Thời gian</th><th>Loại</th><th>Số tiền</th><th>Trạng thái</th></tr>"
  DB.topups.filter(t=>t.user===cur).forEach(t=>{
    topupTable.innerHTML+=`<tr><td>${t.time}</td><td>${t.type}</td><td>${t.amount}</td><td>${t.status}</td></tr>`
  })
}

function loadOrder(){
  orderTable.innerHTML="<tr><th>Thời gian</th><th>Game</th><th>Gói</th><th>Giá</th><th>Trạng thái</th></tr>"
  DB.orders.filter(o=>o.user===cur).forEach(o=>{
    orderTable.innerHTML+=`<tr><td>${o.time}</td><td>${o.game}</td><td>${o.pack}</td><td>${o.price}</td><td>${o.status}</td></tr>`
  })
}
</script>
<!-- CSKH -->
<div id="chatBtn" onclick="toggleChat()">💬 CSKH</div>

<div id="chatBox" class="hidden">
  <div class="chat-header">
    CSKH Ngọc Becon
    <span style="cursor:pointer" onclick="toggleChat()">✖</span>
  </div>

  <div id="chatContent">
    <div class="msg user">
      <div class="bubble">Chào shop 💗</div>
    </div>
  </div>

  <div class="chat-input">
    <input id="chatMsg" placeholder="Nhắn tin">
    <button onclick="sendText()">➤</button>
  </div>
</div>
  
</body>
</html>
